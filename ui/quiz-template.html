h is why\n   only the default variant was broken. */\n/* Item 7: below 900px the sidebar is a real off-canvas drawer rather than a block stacked above the\n   quiz -- it holds settings, so it should be out of the way until asked for. `data-init` on the\n   body closes it at this width on load, and a click outside dismisses it. */\n@media (max-width: 900px) {\n  .layout {\n    grid-template-columns: minmax(0, 1fr);\n  }\n\n  .sidebar {\n    position: fixed;\n    /* the TOKEN, not a repeat of its value: the bar measures 62px (the hamburger's touch target),\n       and a hardcoded 3rem opened the drawer 14px under it */\n    top: var(--topbar-h);\n    bottom: 0;\n    left: 0;\n    max-height: none;\n    z-index: 30;\n    width: min(20rem, 88vw);\n    padding: 1rem;\n    overflow-y: auto;\n    background: var(--side);\n    box-shadow: var(--elev-4);\n    border-radius: 0 18px 0 0;\n  }\n\n  .layout.nav-closed {\n    gap: 1.5rem;\n  }\n}\n\n/* --- overflow insurance ---------------------------------------------------- *\n * Two places where content can be wider than its box, both of which show up as a horizontal\n * scrollbar on the whole page rather than as a local problem:\n *   - auction text and bml descriptions are joined with invisible separators and can contain long\n *     unbroken tokens (`invite(~10/11)`), so they get an explicit break opportunity;\n *   - the app bar is a nowrap flex row, and a flex item will not shrink below its content unless it\n *     is told it may -- `min-width: 0` plus an ellipsis on the title is what lets the HUD survive a\n *     narrow window instead of pushing the page wider.\n */\n.answer,\n.candidate-text,\n.finale-label {\n  overflow-wrap: anywhere;\n}\n\n.topbar h1 {\n  min-width: 0;\n  overflow: hidden;\n  text-overflow: ellipsis;\n  white-space: nowrap;\n}\n\n.topbar-score,\n.topbar .skip,\n.streak {\n  min-width: 0;\n}\n\n/* --- touch and small screens ------------------------------------------------ *\n * Measured on an emulated 390x844 phone: the hamburger was a 33x15px target and Skip 70x27, both well\n * under the ~44px minimum a finger needs. And at 2rem an auction wraps to three lines, so each choice\n * became a 103px-tall card and the page ran to 1207px of scroll -- the type scale is what to fix, not\n * the layout, which had no horizontal overflow at any width. */\n.nav-toggle {\n  display: inline-flex;\n  align-items: center;\n  justify-content: center;\n  min-width: 44px;\n  min-height: 44px;\n}\n\n/* A coarse pointer gets the bigger targets; a mouse does not need them, and a 44px-tall Skip would\n   make the app bar taller for everyone. */\n.topbar .skip {\n  /* a floor even with a mouse: 27px was the measured height, which is a small target for the one\n     action you take mid-question */\n  min-height: 32px;\n}\n\n@media (pointer: coarse) {\n  .topbar .skip {\n    min-height: 44px;\n    padding-inline: 0.8rem;\n  }\n}\n\n@media (max-width: 560px) {\n  .answer {\n    font-size: 1.4rem;\n    padding: 0.45rem 0.6rem;\n    /* every rem of dead space between the prompt and the choices is a choice pushed under the\n       fold -- the phone complaint is that five answers do not fit at once */\n    margin-bottom: 0.9rem;\n  }\n\n  .candidate,\n  .candidate.button {\n    font-size: 1.3rem;\n    min-height: 2.9rem;\n  }\n\n  .intro {\n    font-size: 1.05rem;\n    margin-bottom: 0.5rem;\n  }\n\n  /* a phone has no room for a 16rem minimum column: one choice per row, full width */\n  .candidates {\n    grid-template-columns: minmax(0, 1fr);\n    padding: 0.5rem;\n    /* one column, so the gap only ever costs height: 0.8rem x 4 was a sixth of a card */\n    gap: 0.5rem;\n  }\n\n  .card {\n    padding: 0.7rem;\n  }\n\n  .notes iframe {\n    height: 55vh;\n  }\n}\n\n/* --- the app bar on a phone ------------------------------------------------- *\n * Three fixes, all measured at 390x844 (iPhone 12) and 360x740 (Galaxy S9):\n *   - the score no longer wraps (see `.topbar-score` above), which is what made the bar 78px tall\n *     and its contents read vertically;\n *   - the gaps and the theme toggle tighten, so the title keeps some width before the ellipsis;\n *   - below 400px the correct/attempted FRACTION drops. That is the next rung of the same\n *     shedding ladder as the gauge at 760px: points survive because they are what the skips are\n *     earned against, and the fraction is still on the drawer's dial. */\n@media (max-width: 520px) {\n  .topbar {\n    gap: 0.5rem;\n    padding-inline: 0.6rem;\n  }\n\n  .theme-toggle {\n    padding: 0.3rem;\n  }\n}\n\n/* 400px, so BOTH common phone widths are on the same side of it: 390 (iPhone 12/13/14) and 360\n   (Galaxy S9 and most of android). Measured with the fraction in, the title had 86-116px left --\n   \"U16 Squad S...\" -- and the bar read as five things fighting; without it the title gets ~118px\n   at both widths and the live number is still there. Nothing is lost: the fraction is on the\n   drawer's dial, and the aria-labels in the bar never dropped it. */\n@media (max-width: 400px) {\n  .score-fraction {\n    display: none;\n  }\n}\n\n/* THE COUNTDOWN GOES ABOVE THE QUESTION AND STICKS TO THE BAR (phone/tablet widths only).\n * It used to sit below the card in flow, which on a phone put it in the worst possible place: with\n * five choices it is already at the fold, and the browser's own URL bar -- which slides back in the\n * moment you scroll up -- covers whatever is at the bottom of the viewport. So the one element that\n * is worthless off-screen was the one most likely to be off-screen.\n * `order: -1` moves it visually only; the DOM (and so the screen-reader order, and every template)\n * is untouched. It is also slimmer here: it is a bar, not a panel, and the height it gives back is\n * most of an answer card. */\n@media (max-width: 900px) {\n  .main {\n    display: flex;\n    flex-direction: column;\n  }\n\n  .timer {\n    order: -1;\n    position: sticky;\n    top: var(--topbar-h);\n    z-index: 12;\n    height: 1.4rem;\n    margin: 0 0 0.8rem;\n  }\n}\n\n/* THE THEME SWITCH. Both palettes live in `light-dark()` pairs on the tokens above, not in a\n   `@media (prefers-color-scheme: dark)` block -- which is what makes an always-available toggle\n   possible at all. A media query answers to the OS and to nothing else, so a palette written that\n   way can only be overridden by writing it a second time; `light-dark()` resolves against the\n   element's COMPUTED `color-scheme`, so forcing one is a single declaration. It also moves the\n   browser's own surfaces -- canvas, scrollbars, form controls -- which a class on <body> would not.\n\n   `$_theme` is mirrored onto <html> as `data-theme`, and is absent when it is `auto` (the default),\n   where `color-scheme: light dark` hands the choice back to the OS. On the ROOT, because that is the\n   only element the canvas and the scrollbars read their scheme from -- the black-rim lesson again,\n   see the `html` rule above. Pico and Bulma document the same attribute in the same place, so their\n   own dark themes follow this toggle without being told about it. */\n:root[data-theme=\"dark\"] {\n  color-scheme: only dark;\n}\n\n:root[data-theme=\"light\"] {\n  color-scheme: only light;\n}\n\n/* The section an AMBIGUOUS auction comes from (\"Opponents open Strong 1C\"), under the auction: the\n   same calls mean different things in different parts of the notes, and without it the player has\n   to guess which part the question is from. */\n.quiz-context {\n  display: block;\n  margin-top: 0.2rem;\n  font-size: 0.9rem;\n  font-weight: normal;\n  opacity: 0.75;\n}\n", "juice.css": "/* The \"game feel\" experiment: three effects, one toggle, no base-stylesheet changes.\n *\n * Loaded after whichever of the three base sheets is selected, and EVERY rule is scoped to\n * `body.juice` (set by `data-class=\"{juice: $_juice}\"` on the body). So:\n *   - with the toggle off, this file changes nothing at all -- it is not a fourth variant;\n *   - it works identically over the hand-rolled, Pico and Bulma sheets, because it only adds\n *     animation and colour to elements all three already lay out;\n *   - deleting the experiment is deleting one file, one signal and one checkbox.\n *\n * The three effects (see DESIGN.md for the reasoning):\n *   1. HIT-STOP + SHAKE on the reveal. A wrong answer freezes for a beat, then the card you picked\n *      shakes and the right one lands. The shake is on the CARD, never the page: at a question every\n *      ~15s, screen shake is nausea, and shaking the specific card is also more informative.\n *   2. FLOATING SCORE off the card you chose, streamed beat-by-beat with the toasts\n *      (`templates/floater.html.j2`), so the points appear where the action was.\n *   3. STREAK CHIP that grows and warms, because a run was previously invisible outside one toast.\n *\n * Tokens are reused from the base sheet rather than redefined -- `--suit-club` / `--suit-heart` are\n * the app's existing \"right\" and \"wrong\" greens and reds, already contrast-tested in both palettes.\n */\n\n/* --- 1. hit-stop and shake ------------------------------------------------- */\n\n/* The freeze is the `animation-delay`: the reveal arrives, nothing moves for 90ms, and then it hits.\n   Doing nothing is the effect -- the pause is what makes the shake read as an impact rather than a\n   transition. */\n@keyframes juice-shake {\n  0%,\n  100% {\n    transform: translateX(0);\n  }\n  15% {\n    transform: translateX(-6px) rotate(-0.6deg);\n  }\n  30% {\n    transform: translateX(5px) rotate(0.5deg);\n  }\n  45% {\n    transform: translateX(-4px) rotate(-0.4deg);\n  }\n  60% {\n    transform: translateX(3px) rotate(0.3deg);\n  }\n  80% {\n    transform: translateX(-1px);\n  }\n}\n\n@keyframes juice-land {\n  0% {\n    transform: scale(0.94);\n  }\n  55% {\n    transform: scale(1.035);\n  }\n  100% {\n    transform: scale(1);\n  }\n}\n\n@keyframes juice-mark-punch {\n  0% {\n    transform: scale(0.2) rotate(-25deg);\n    opacity: 0;\n  }\n  60% {\n    transform: scale(1.35) rotate(4deg);\n    opacity: 1;\n  }\n  100% {\n    transform: scale(1) rotate(0);\n    opacity: 1;\n  }\n}\n\nbody.juice .candidate.revealed.wrong {\n  animation: juice-shake 260ms cubic-bezier(0.36, 0.07, 0.19, 0.97) 90ms both;\n  /* the shake is a transform, so the border colour carries the \"this one\" emphasis */\n  box-shadow: 0 0 0 2px var(--suit-heart);\n}\n\n/* The right answer lands AFTER the shake, not with it: two things moving at once reads as noise,\n   one then the other reads as \"wrong... and here is what it was\". */\nbody.juice .candidate.revealed.correct {\n  animation: juice-land 320ms ease-out 300ms both;\n  box-shadow: 0 0 0 2px var(--suit-club);\n}\n\nbody.juice .candidate.revealed .mark {\n  display: inline-block;\n  animation: juice-mark-punch 260ms cubic-bezier(0.2, 1.4, 0.4, 1) 120ms both;\n}\n\nbody.juice .candidate.revealed.correct .mark {\n  animation-delay: 380ms;\n}\n\n/* The cards that were neither picked nor right recede, so the two that matter are the only ones with\n   contrast. Cheaper and calmer than animating them too. */\nbody.juice .candidate.revealed:not(.correct):not(.wrong) {\n  opacity: 0.35;\n  transition: opacity 200ms ease-out 300ms;\n}\n\n/* --- 1b. the card behaves like something you can press --------------------- *\n * Nothing happened before you committed: no hover, no press, no acknowledgement between the click\n * and the answer stream arriving. These two are the cheapest \"this is a button\" cues there are, and\n * they animate the edge and shadow the surface ladder just gave the cards (see `app.css`).\n *\n * `:not(:disabled)` matters: the cards are disabled while an answer is in flight, and a card that\n * lifts under the cursor while it is refusing input is a lie. */\nbody.juice .candidate:not(:disabled) {\n  transition:\n    transform 120ms ease-out,\n    box-shadow 120ms ease-out,\n    border-color 120ms ease-out;\n}\n\n/* `hover: hover`, for the reason `app.css` gives at its own `.candidate:hover`: on a touch device\n   :hover latches after the tap, so the answered card stayed lifted and accent-bordered underneath\n   the NEXT question. `:active` below needs no guard -- a tap ends it. */\n@media (hover: hover) {\n  body.juice .candidate:not(:disabled):hover {\n    transform: translateY(-2px);\n    border-color: var(--card-accent);\n    box-shadow: var(--elev-3);\n  }\n}\n\n/* Pressed: down and slightly in, back to the resting rung -- the physical read of \"this went\n   down\" is the DROP from the hover rung, plus the transform, over 60ms so it is felt rather than\n   watched. With a mouse that is rung 3 -> rung 1; on a touch screen there is no hover to fall from,\n   which is why the transform carries the press there. */\nbody.juice .candidate:not(:disabled):active {\n  transform: translateY(1px) scale(0.985);\n  box-shadow: var(--elev-1);\n  transition-duration: 60ms;\n}\n\n/* --- 2. floating score ----------------------------------------------------- */\n\n/* The card is the positioning context. `position: relative` is safe to add here because all three\n   base sheets lay the cards out with grid/flex and none of them position their contents. */\nbody.juice .candidate {\n  position: relative;\n}\n\n/* The rise is a VARIABLE, not a constant, because the card it rises out of is 103px tall on a desktop\n   and 48px on a phone. At a fixed -68px the number climbed clear of its own card and landed on the one\n   ABOVE it -- measured, with one card per row at phone width. Keyframes cannot be parameterised any\n   other way, so the distance and the peak are custom properties the media query below overrides. */\n@keyframes juice-float {\n  0% {\n    transform: translate(-50%, 0) scale(0.8);\n    opacity: 0;\n  }\n  18% {\n    transform: translate(-50%, var(--float-peak, -12px)) scale(1.15);\n    opacity: 1;\n  }\n  100% {\n    transform: translate(-50%, var(--float-rise, -68px)) scale(1);\n    opacity: 0;\n  }\n}\n\n.floater {\n  /* invisible unless the experiment is on: the server streams these either way, because `$_juice` is\n     a local signal it never sees */\n  display: none;\n}\n\nbody.juice .floater {\n  display: block;\n  /* a scored number is chrome, not reading: the display face, like the HUD it is counting into */\n  font-family: var(--display-font);\n  position: absolute;\n  left: 50%;\n  bottom: 60%;\n  z-index: 5;\n  pointer-events: none;\n  font-size: 1.6rem;\n  font-weight: 800;\n  font-variant-numeric: tabular-nums;\n  letter-spacing: -0.02em;\n  /* readable over a pale card face and over a dark one, without needing a palette of its own */\n  text-shadow:\n    0 1px 0 rgb(255 255 255 / 55%),\n    0 2px 10px rgb(0 0 0 / 35%);\n  animation: juice-float 1100ms cubic-bezier(0.22, 0.9, 0.3, 1) both;\n}\n\nbody.juice .floater.gain {\n  color: var(--suit-club);\n}\n\nbody.juice .floater.loss {\n  color: var(--suit-heart);\n}\n\n/* Several beats land on the same card within a second (points, then streak bonus, then time bonus).\n   Staggering by DOM order turns a pile-up into a rising column -- the stack is the reward. */\nbody.juice .floater:nth-of-type(2) {\n  animation-delay: 60ms;\n  bottom: 70%;\n}\n\nbody.juice .floater:nth-of-type(3) {\n  animation-delay: 120ms;\n  bottom: 80%;\n}\n\nbody.juice .floater:nth-of-type(n + 4) {\n  animation-delay: 180ms;\n  bottom: 90%;\n}\n\n/* --- 2b. the correct card rings ------------------------------------------- *\n * A correct answer had no beat of its own on the CARD: the toasts said so in the corner, the floater\n * gave the number, and then the next question arrived. This flashes the card you got right, in green,\n * for the length of the celebration.\n *\n * `:has(.floater.gain)` is what makes it possible without a scrap of JavaScript: the server appends\n * the floater to the card it was earned on, so the card can style ITSELF from the presence of its\n * own child. No signal, no class toggle, no bookkeeping -- the same \"state is already in the DOM\"\n * trick as `[aria-busy]`, one level down. (Not `:has(.floater)`, which would also ring a red ladder\n * deduction green.) */\n@keyframes juice-correct-ring {\n  0% {\n    box-shadow: 0 0 0 0 rgb(46 139 87 / 65%);\n    border-color: var(--card-accent);\n  }\n  35% {\n    box-shadow: 0 0 0 6px rgb(46 139 87 / 0%);\n    border-color: var(--suit-club);\n  }\n  100% {\n    box-shadow: var(--elev-1);\n    border-color: var(--card-edge);\n  }\n}\n\nbody.juice .candidate:has(.floater.gain) {\n  animation: juice-correct-ring 900ms ease-out both;\n}\n\n/* --- the score animation on a phone --------------------------------------- *\n * Measured at 390x844: the choice cards are 48px tall and one per row, so a 25.6px number rising 68px\n * left its own card and overlapped the card above. Two changes: it rises less far and smaller, and\n * several beats spread SIDEWAYS instead of stacking upward -- the rising column only works when there\n * is room above the card, which on a phone there is not. */\n@media (max-width: 560px) {\n  body.juice .floater {\n    --float-rise: -34px;\n    --float-peak: -8px;\n    font-size: 1.15rem;\n    bottom: 55%;\n  }\n\n  body.juice .floater:nth-of-type(2) {\n    bottom: 55%;\n    left: 28%;\n  }\n\n  body.juice .floater:nth-of-type(3) {\n    bottom: 55%;\n    left: 72%;\n  }\n\n  body.juice .floater:nth-of-type(n + 4) {\n    bottom: 78%;\n    left: 50%;\n  }\n\n  /* the goal-crossing number is the loudest thing on the screen; it can be big, but not 2.4rem big on\n     a 390px viewport */\n  body.juice .floater.final {\n    font-size: 1.6rem;\n  }\n}\n\n/* --- 3. streak chip -------------------------------------------------------- */\n\n/* Hidden by default AND at streak zero: the markup is always in the app bar, but a chip reading\n   \"0×\" is worse than no chip, and with the experiment off it should not exist at all. */\n.streak {\n  display: none;\n}\n\nbody.juice .streak {\n  display: inline-block;\n  font-family: var(--display-font);\n  transform-origin: center;\n  margin-right: 0.5rem;\n  padding: 0.1rem 0.45rem;\n  border-radius: 999px;\n  font-size: 0.85rem;\n  font-weight: 700;\n  font-variant-numeric: tabular-nums;\n  color: #fff;\n  background: rgb(255 255 255 / 18%);\n  /* the growth: the scale comes from `data-style:transform`, so each correct answer is a step and\n     this transition is what makes the step visible rather than instant */\n  transition:\n    transform 220ms cubic-bezier(0.2, 1.5, 0.4, 1),\n    background-color 300ms ease-out,\n    box-shadow 300ms ease-out;\n}\n\n/* The word, not the number: lighter and smaller, so \"streak\" labels the chip without competing\n   with the count that is the point of it. */\nbody.juice .streak-label {\n  font-weight: 600;\n  font-size: 0.72rem;\n  letter-spacing: 0.02em;\n  opacity: 0.8;\n  margin-right: 0.1rem;\n}\n\n/* No room for it on a phone -- the bar is hamburger, title, theme, score and Skip already. The chip\n   keeps its `aria-label`, so what it means is still available where it matters most. */\n@media (max-width: 560px) {\n  body.juice .streak-label {\n    display: none;\n  }\n}\n\nbody.juice .streak.cold {\n  display: none;\n}\n\nbody.juice .streak.hot {\n  background: #d29922;\n  box-shadow: 0 0 12px rgb(210 153 34 / 55%);\n}\n\nbody.juice .streak.blazing {\n  background: linear-gradient(180deg, #f0b429, #cf6a22);\n  box-shadow:\n    0 0 16px rgb(240 180 41 / 70%),\n    0 0 32px rgb(207 106 34 / 45%);\n}\n\n/* --- 4. the finale ---------------------------------------------------------- *\n * Crossing the points goal is the payoff for several minutes of play and it used to be three static\n * emoji. Four things happen, in this order, which is the whole trick -- a sequence reads as an event,\n * everything-at-once reads as a page load:\n *\n *   0ms    the card itself arrives (scale + fade)\n *   120ms  the party emoji pop in, staggered\n *   150ms  confetti bursts upward and falls\n *   400ms  the numbers assemble, digit by digit, from alternating sides\n *\n * Every delay is `calc(<base> + var(--i) * <step>)`, with `--i` rendered into the markup by\n * `completed.html.j2` -- CSS cannot count for itself, so the server numbers the pieces.\n */\n\n/* the panel lands first, and `:has()` means nothing has to tell it the quiz is over */\n@keyframes juice-finale-in {\n  0% {\n    transform: scale(0.94);\n    opacity: 0;\n  }\n  60% {\n    transform: scale(1.012);\n    opacity: 1;\n  }\n  100% {\n    transform: scale(1);\n    opacity: 1;\n  }\n}\n\nbody.juice .card:has(.finale) {\n  animation: juice-finale-in 420ms cubic-bezier(0.2, 1.1, 0.3, 1) both;\n  /* the confetti positions against this, and it has to: see the note on `.confetti` below */\n  position: relative;\n}\n\n/* the party emoji: overshoot hard, then settle and breathe. Emoji ignore `color`, so scale and\n   rotation are the only expressive channels they have. */\n@keyframes juice-pop {\n  0% {\n    transform: scale(0) rotate(-45deg);\n  }\n  55% {\n    transform: scale(1.45) rotate(12deg);\n  }\n  80% {\n    transform: scale(0.92) rotate(-5deg);\n  }\n  100% {\n    transform: scale(1) rotate(0);\n  }\n}\n\n@keyframes juice-breathe {\n  0%,\n  100% {\n    transform: translateY(0) rotate(-3deg);\n  }\n  50% {\n    transform: translateY(-6px) rotate(3deg);\n  }\n}\n\nbody.juice .pop {\n  /* pop, then hand over to a slow idle wobble -- staggered so the three do not move as one block */\n  animation:\n    juice-pop 520ms cubic-bezier(0.2, 1.6, 0.3, 1) calc(120ms + var(--i) * 90ms) both,\n    juice-breathe 3.2s ease-in-out calc(900ms + var(--i) * 220ms) infinite;\n}\n\n/* Confetti. ABSOLUTE against the card, not fixed to the viewport -- and that is not a preference:\n   the card's own entrance animation is a `transform`, which makes it a containing block for fixed\n   positioning, so `position: fixed` here was quietly measured against the card anyway and came out\n   in the wrong place with the wrong stacking. Absolute says what is actually happening.\n   `pointer-events: none` so the party cannot swallow a click on Restart. Drift and spin come from the\n   markup (`--drift`, `--spin`); the burst goes UP first and then falls, because confetti that only\n   falls reads as rain. */\n.confetti {\n  display: none;\n}\n\n@keyframes juice-confetti {\n  0% {\n    transform: translate(0, 0) rotate(0);\n    opacity: 0;\n  }\n  10% {\n    opacity: 1;\n  }\n  30% {\n    transform: translate(calc(var(--drift) * 0.4), -22vh) rotate(calc(var(--spin) * 0.4));\n  }\n  100% {\n    transform: translate(var(--drift), 84vh) rotate(var(--spin));\n    opacity: 0;\n  }\n}\n\nbody.juice .confetti {\n  display: block;\n  position: absolute;\n  top: 15%;\n  left: 50%;\n  z-index: 40;\n  pointer-events: none;\n}\n\nbody.juice .confetti-bit {\n  position: absolute;\n  font-size: 1.7rem;\n  animation: juice-confetti 2.6s cubic-bezier(0.25, 0.6, 0.4, 1) calc(150ms + var(--i) * 70ms) both;\n}\n\n/* The numbers assemble: each digit flies in from alternating sides, overshoots and settles. The\n   translate is large enough that they come from outside the card -- \"fragments forming numbers\". */\n@keyframes juice-assemble-left {\n  0% {\n    transform: translate(-60vw, -30vh) rotate(-120deg) scale(2.2);\n    opacity: 0;\n  }\n  70% {\n    opacity: 1;\n  }\n  100% {\n    transform: translate(0, 0) rotate(0) scale(1);\n    opacity: 1;\n  }\n}\n\n@keyframes juice-assemble-right {\n  0% {\n    transform: translate(60vw, -26vh) rotate(140deg) scale(2.2);\n    opacity: 0;\n  }\n  70% {\n    opacity: 1;\n  }\n  100% {\n    transform: translate(0, 0) rotate(0) scale(1);\n    opacity: 1;\n  }\n}\n\nbody.juice .digit {\n  animation: juice-assemble-left 620ms cubic-bezier(0.16, 1, 0.3, 1) calc(400ms + var(--i) * 110ms) both;\n}\n\n/* alternate the side per digit, so a four-figure score does not sweep in like a train */\nbody.juice .digit:nth-child(even) {\n  animation-name: juice-assemble-right;\n}\n\n/* The goal-crossing floater: same number, gold, larger, slower -- the last one the player sees. */\nbody.juice .floater.final {\n  color: #f0b429;\n  font-size: 2.4rem;\n  text-shadow:\n    0 1px 0 rgb(255 255 255 / 55%),\n    0 0 18px rgb(240 180 41 / 70%);\n  animation-duration: 1600ms;\n}\n\n/* The points gauge, when it is finally full. `data-class` sets `.full` off `$_pointsPct >= 100`, so\n   the bar celebrates itself without the server saying anything extra. */\n@keyframes juice-gauge-full {\n  0%,\n  100% {\n    filter: none;\n  }\n  50% {\n    filter: brightness(1.25) saturate(1.3);\n  }\n}\n\nbody.juice .points-meter.full {\n  animation: juice-gauge-full 1.1s ease-in-out 3;\n  box-shadow: 0 0 12px rgb(46 139 87 / 60%);\n}\n\n/* --- 5. the countdown gets urgent ------------------------------------------ *\n * The last band of the timer was the DULLEST thing on the screen: `.spent` paints it grey, so the\n * final ~5 seconds -- the ones where the bonus is draining fastest in proportional terms -- looked\n * like the bar had already given up. It has not: the time bonus is continuous\n * (`round(base * percent_left / 100)`), so there are points on the table right up to zero.\n *\n * So under the toggle that band goes RED and throbs. No new server signal and no new thresholds: the\n * bands are already in the DOM as classes (`data-class` on the fill), and `--suit-heart` is the app's\n * existing red, contrast-tested in both palettes.\n *\n * Two halves, because the fill runs out of width before the question runs out of time:\n *   - the FILL brightens on the beat, while there is still some of it;\n *   - the TRACK glows, so at 0% -- a zero-width fill you cannot animate -- the bar is still saying\n *     something. `overflow: hidden` on `.timer` clips its children, not its own shadow.\n * `:has()` on the track is the same \"the state is already in the DOM\" move as the correct-card ring.\n */\n@keyframes juice-timer-throb {\n  0%,\n  100% {\n    filter: none;\n  }\n  50% {\n    filter: brightness(1.4) saturate(1.15);\n  }\n}\n\n@keyframes juice-timer-alarm {\n  0%,\n  100% {\n    box-shadow: 0 0 0 rgb(0 0 0 / 0%);\n  }\n  50% {\n    box-shadow: 0 0 14px color-mix(in srgb, var(--suit-heart) 55%, transparent);\n  }\n}\n\n/* `.ticking` is doing real work here: without it a bar frozen in the last band keeps throbbing\n   behind the reveal, hurrying you along on a question that is already answered. */\nbody.juice .timer-fill.spent.ticking {\n  background: var(--suit-heart);\n  animation: juice-timer-throb 620ms ease-in-out infinite;\n}\n\nbody.juice .timer:has(.timer-fill.spent.ticking) {\n  animation: juice-timer-alarm 620ms ease-in-out infinite;\n}\n\n/* --- 6. the milestone sweep ------------------------------------------------ *\n * The points gauge carries the milestone notches, so it is the thing that says WHERE the next skip\n * is -- and it was the one part of the HUD that said nothing when one was collected. The award\n * arrived as a corner toast, third or fourth in a chain of them, while the bar it was measured\n * against sat still and merely got longer.\n *\n * So the bar acknowledges it: a light crosses the gauge, once, on the beat the milestone lands\n * (`app._answer_stream` appends `.meter-sweep` when `toast.awards_skip`). No new signal -- the server\n * already knows, because it is the thing that awarded the skip.\n *\n * Two details worth keeping:\n *   - the shine is WHITE at low alpha rather than a colour: the track is a red-to-green gradient, so\n *     any tint would read as a different score on the way past;\n *   - `.meter` is `overflow: hidden` in all three base sheets, so the sweep can start and end off the\n *     ends of the bar and be clipped to it, which is what makes it a pass rather than a fade. */\n@keyframes juice-meter-sweep {\n  from {\n    transform: translateX(-120%) skewX(-18deg);\n  }\n  to {\n    transform: translateX(520%) skewX(-18deg);\n  }\n}\n\n/* the reduced-motion stand-in: the same acknowledgement, with no travel */\n@keyframes juice-meter-flush {\n  0%,\n  100% {\n    opacity: 0;\n  }\n  40% {\n    opacity: 1;\n  }\n}\n\nbody.juice .meter-sweep {\n  position: absolute;\n  top: 0;\n  bottom: 0;\n  left: 0;\n  width: 22%;\n  pointer-events: none;\n  background: linear-gradient(\n    to right,\n    rgb(255 255 255 / 0%),\n    rgb(255 255 255 / 75%),\n    rgb(255 255 255 / 0%)\n  );\n  animation: juice-meter-sweep 780ms cubic-bezier(0.3, 0, 0.2, 1) 1 both;\n}\n\n/* --- honesty about motion -------------------------------------------------- *\n * The base sheets already collapse their transitions under `prefers-reduced-motion`; this file adds\n * the effects that most need it, so it repeats the rule for its own. The floaters and the marks stay\n * VISIBLE and simply do not move: the information they carry is the number and the tick, not the\n * animation. */\n@media (prefers-reduced-motion: reduce) {\n  body.juice .candidate.revealed.wrong,\n  body.juice .candidate.revealed.correct,\n  body.juice .candidate.revealed .mark,\n  body.juice .candidate:has(.floater.gain) {\n    animation: none;\n  }\n\n  /* the hover and press cues stay, they just stop being animated: a state change is information,\n     the 120ms it takes to get there is not */\n  body.juice .candidate:not(:disabled) {\n    transition: none;\n  }\n\n  /* ...but the correct card should still be marked, since its animation carried the only on-card\n     signal that the answer was right */\n  body.juice .candidate:has(.floater.gain) {\n    border-color: var(--suit-club);\n  }\n\n  body.juice .floater {\n    animation: none;\n    opacity: 1;\n    transform: translate(-50%, -24px);\n  }\n\n  body.juice .streak {\n    transition: none;\n  }\n\n  /* The finale keeps every piece, and stops moving. The numbers are the point of it -- they must be\n     legible at rest -- and the confetti is dropped entirely rather than parked mid-air, because\n     sixteen emoji frozen over the page is worse than no confetti. */\n  body.juice .card:has(.finale),\n  body.juice .pop,\n  body.juice .digit {\n    animation: none;\n  }\n\n  body.juice .confetti {\n    display: none;\n  }\n\n  body.juice .points-meter.full {\n    animation: none;\n  }\n\n  /* A sweep is travel and nothing else -- there is no state left behind when it finishes, so unlike\n     the marks and floaters there is nothing to keep visible. It becomes a single brief flush of the\n     bar instead: the milestone is still acknowledged where it was earned, without anything crossing\n     the screen. */\n  body.juice .meter-sweep {\n    animation: juice-meter-flush 700ms ease-in-out 1 both;\n    width: 100%;\n    background: rgb(255 255 255 / 30%);\n  }\n\n  /* the countdown keeps the COLOUR and loses the beat: \"you are nearly out of time\" is information,\n     the throb is only how loudly it is said */\n  body.juice .timer-fill.spent.ticking,\n  body.juice .timer:has(.timer-fill.spent.ticking) {\n    animation: none;\n  }\n\n  body.juice .timer:has(.timer-fill.spent.ticking) {\n    box-shadow: 0 0 10px color-mix(in srgb, var(--suit-heart) 45%, transparent);\n  }\n}\n"}, "media": {"completed.jpeg": "/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAcFBQYFBAcGBgYIBwcICxILCwoKCxYPEA0SGhYbGhkWGRgcICgiHB4mHhgZIzAkJiorLS4tGyIyNTEsNSgsLSz/2wBDAQcICAsJCxULCxUsHRkdLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCz/wgARCASwAsgDASIAAhEBAxEB/8QAGwAAAwEBAQEBAAAAAAAAAAAAAgMEAQAFBgf/xAAYAQEBAQEBAAAAAAAAAAAAAAAAAQIDBP/aAAwDAQACEAMQAAAB9GvlebsWLao7TOmSVuEFqx6whPR1ixDIbFYfm0SbOddq2uTIoKl2v89wgu3IyoPOq6cTgKNOyLGEq+o0FYHEvoLScnfQqRr1xMYmvbj0DgQN6fjnQ1Lq6fJlvXX1nz/tEwQ3UixdMMMFxKyx9eR6LKBAU6fN+ncQcUpl8BdDGAA0VU2C4NidVQUns5fR7aLmRz2k8NVCmOpQhneKerA56zE47FAs6RaXz26XBFUq6h8r02aOHKc5S1VRwwtnRD36sGOuenc+SHrGug3dFgoYpzGKSiWkQ2moLbSIpydHrSle5Rm8ygm3fMKrZEHoqF8RrYm21LZ02T1XHzlfqhLPRJRZHaDxTPNbFjPKrpquwZOqgfyuS6g1WS3qnlYG2VHh6hRkK8Q0w0kdZSKUS0o62ydbVyvia4UYSlcy7xs5kC2B5vcQJYBpMmAcIFXm 					log = log.substring(0, n);

						this.mem.storeInt(p, log.length+1);
					} else if (pname == 35720) {

					let ls = name.lastIndexOf("["),
					arrayIndex = name.slice(ls + 1, -1);
					if (arrayIndex.length > 0 && (arrayOffset = parseInt(arrayIndex)) < 0) {

			ClientWaitSync: (sync, flags, timeout) => {
				this.assertWebGL2();
				return this.ctx.clientWaitSync(this.syncs[sync], flags, timeout);
			},
			WaitSync: (sync, flags, timeout) => {
				this.assertWebGL2();
				this.ctx.waitSync(this.syncs[sync], flags, timeout)	;
			},


			/* Transform Feedback */
			CreateTransformFeedback: () => {
				this.assertWebGL2();
				let transformFeedback = this.ctx.createTransformFeedback();
				let id = this.getNewId(this.transformFeedbacks);
				transformFeedback.name = id;
				this.transformFeedbacks[id] = transformFeedback;
				return id;
			},
			DeleteTransformFeedback: (id)  => {
				this.assertWebGL2();
				let obj = this.transformFeedbacks[id];
				if (obj && id != 0) {
					this.ctx.deleteTransformFeedback(obj);
					this.transformFeedbacks[id] = null;
				}
			},
			IsTransformFeedback: (tf) => {
				this.assertWebGL2();
				return this.ctx.isTransformFeedback(this.transformFeedbacks[tf]);
			},
			BindTransformFeedback: (target, tf) => {
				this.assertWebGL2();
				this.ctx.bindTransformFeedback(target, this.transformFeedbacks[tf]);
			},
			BeginTransformFeedback: (primitiveMode) => {
				this.assertWebGL2();
				this.ctx.beginTransformFeedback(primitiveMode);
			},
			EndTransformFeedback: () => {
				this.assertWebGL2();
				this.ctx.endTransformFeedback();
			},
			TransformFeedbackVaryings: (program, varyings_ptr, varyings_len, bufferMode) => {
				this.assertWebGL2();
				const stringSize = this.mem.intSize*2;
				let varyings = [];
				for (let i = 0; i < varyings_len; i++) {
					let ptr = this.mem.loadPtr(varyings_ptr + i*stringSize + 0*4);
					let len = this.mem.loadPtr(varyings_ptr + i*stringSize + 1*4);
					varyings.push(this.mem.loadString(ptr, len));
				}
				this.ctx.transformFeedbackVaryings(this.programs[program], varyings, bufferMode);
			},
			PauseTransformFeedback: () => {
				this.assertWebGL2();
				this.ctx.pauseTransformFeedback();
			},
			ResumeTransformFeedback: () => {
				this.assertWebGL2();
				this.ctx.resumeTransformFeedback();
			},


			/* Uniform Buffer Objects and Transform Feedback Buffers */
			BindBufferBase: (target, index, buffer) => {
				this.assertWebGL2();
				this.ctx.bindBufferBase(target, index, this.buffers[buffer]);
			},
			BindBufferRange: (target, index, buffer, offset, size) => {
				this.assertWebGL2();
				this.ctx.bindBufferRange(target, index, this.buffers[buffer], offset, size);
			},
			GetUniformBlockIndex: (program, uniformBlockName_ptr, uniformBlockName_len) => {
				this.assertWebGL2();
				return this.ctx.getUniformBlockIndex(this.programs[program], this.mem.loadString(uniformBlockName_ptr, uniformBlockName_len));
			},
			GetActiveUniformBlockName: (program, uniformBlockIndex, name_buf_ptr, name_buf_len, name_length_ptr) => {
				this.assertWebGL2();
				let name = this.ctx.getActiveUniformBlockName(this.programs[program], uniformBlockIndex);

				if (name_buf_ptr && name_buf_len > 0) {
					let n = Math.min(name_buf_len, name.length);
					name = name.substring(0, n);
					this.mem.loadBytes(name_buf_ptr, name_buf_len).set(new TextEncoder().encode(name));
					this.mem.storeInt(name_length_ptr, n);
				} else if (name_length_ptr) {
					this.mem.storeInt(name_length_ptr, name.length);
				}
			},
			GetActiveUniforms: (program, uniformIndices_ptr, uniformIndices_len, pname, res_ptr) => {
				this.assertWebGL2();
				let indices = this.mem.loadU32Array(uniformIndices_ptr, uniformIndices_len);
				this.ctx.getActiveUniforms(this.programs[program], indices, pname)
				this.mem.loadI32Array(res_ptr, indices.length).set(indices)
			},
			GetActiveUniformBlockParameter: (program, uniformBlockIndex, pname, params_ptr) => {
				this.assertWebGL2();
				let res = this.ctx.getActiveUniformBlockParameter(this.programs[program], uniformBlockIndex, pname);

				if (res instanceof Uint32Array) { // for pname GL_UNIFORM_BLOCK_ACTIVE_UNIFORM_INDICES 
					this.mem.loadU32Array(params_ptr, res.length).set(res)
				} else {
					this.mem.storeI32(params_ptr, res)
				}
			},
			UniformBlockBinding: (program, uniformBlockIndex, uniformBlockBinding) => {
				this.assertWebGL2();
				this.ctx.uniformBlockBinding(this.programs[program], uniformBlockIndex, uniformBlockBinding);
			},

			/* Vertex Array Objects */
			CreateVertexArray: () => {
				this.assertWebGL2();
				let vao = this.ctx.createVertexArray();
				let id = this.getNewId(this.vaos);
				vao.name = id;
				this.vaos[id] = vao;
				return id;
			},
			DeleteVertexArray: (id) => {
				this.assertWebGL2();
				let obj = this.vaos[id];
				if (obj && id != 0) {
					this.ctx.deleteVertexArray(obj);
					this.vaos[id] = null;
				}
			},
			IsVertexArray: (vertexArray) => {
				this.assertWebGL2();
				return this.ctx.isVertexArray(this.vaos[vertexArray]);
			},
			BindVertexArray: (vertexArray) => {
				this.assertWebGL2();
				this.ctx.bindVertexArray(this.vaos[vertexArray]);
			},
		};
	}
};


function odinSetupDefaultImports(wasmMemoryInterface, consoleElement, memory) {
	const MAX_INFO_CONSOLE_LINES = 512;
	let infoConsoleLines = new Array();
	let currentLine = {};
	currentLine[false] = "";
	currentLine[true] = "";
	let prevIsError = false;
	
	let event_temp = {};

	const onEventReceived = (event_data, data, callback) => {
		event_temp.data = event_data;
		
		const exports = wasmMemoryInterface.exports;
		const odin_ctx = exports.default_context_ptr();
		
		exports.odin_dom_do_event_callback(data, callback, odin_ctx);
		
		event_temp.data = null;
	};

	const writeToConsole = (line, isError) => {
		if (!line) {
			return;
		}

		const println = (text, forceIsError) => {
			let style = [
				"color: #eee",
				"background-color: #d20",
				"padding: 2px 4px",
				"border-radius: 2px",
			].join(";");
			let doIsError = isError;
			if (forceIsError !== undefined) {
				doIsError = forceIsError;
			}

			if (doIsError) {
				console.log("%c"+text, style);
			} else {
				console.log(text);
			}

		};

		// Print to console
		if (line == "\n") {
			println(currentLine[isError]);
			currentLine[isError] = "";
		} else if (!line.includes("\n")) {
			currentLine[isError] = currentLine[isError].concat(line);
		} else {
			let lines = line.trimEnd().split("\n");
			let printLast = lines.length > 1 && line.endsWith("\n");
			println(currentLine[isError].concat(lines[0]));
			currentLine[isError] = "";
			for (let i = 1; i < lines.length-1; i++) {
				println(lines[i]);
			}
			if (lines.length > 1) {
				let last = lines[lines.length-1];
				if (printLast) {
					println(last);
				} else {
					currentLine[isError] = last;
				}
			}
		}

		if (prevIsError != isError) {
			if (prevIsError) {
				println(currentLine[prevIsError], prevIsError);
				currentLine[prevIsError] = "";
			}
		}
		prevIsError = isError;


		// HTML based console
		if (!consoleElement) {
			return;
		}
		const wrap = (x) => {
			if (isError) {
				return '<span style="color:#f21">'+x+'</span>';
			}
			return x;
		};

		if (line == "\n") {
			infoConsoleLines.push(line);
		} else if (!line.includes("\n")) {
			let prevLine = "";
			if (infoConsoleLines.length > 0) {
				prevLine = infoConsoleLines.pop();
			}
			infoConsoleLines.push(prevLine.concat(wrap(line)));
		} else {
			let lines = line.split("\n");
			let lastHasNewline = lines.length > 1 && line.endsWith("\n");

			let prevLine = "";
			if (infoConsoleLines.length > 0) {
				prevLine = infoConsoleLines.pop();
			}
			infoConsoleLines.push(prevLine.concat(wrap(lines[0]).concat("\n")));

			for (let i = 1; i < lines.length-1; i++) {
				infoConsoleLines.push(wrap(lines[i]).concat("\n"));
			}
			let last = lines[lines.length-1];
			if (lastHasNewline) {
				infoConsoleLines.push(last.concat("\n"));
			} else {
				infoConsoleLines.push(last);
			}
		}

		if (infoConsoleLines.length > MAX_INFO_CONSOLE_LINES) {
			infoConsoleLines.shift(MAX_INFO_CONSOLE_LINES);
		}

		let data = "";
		for (let i = 0; i < infoConsoleLines.length; i++) {
			data = data.concat(infoConsoleLines[i]);
		}

		let info = consoleElement;
		info.innerHTML = data;
		info.scrollTop = info.scrollHeight;
	};

	const listener_key = (id, name, data, callback, useCapture) => {
		return `${id}-${name}-data:${data}-callback:${callback}-useCapture:${useCapture}`;
	};

	let webglContext = new WebGLInterface(wasmMemoryInterface);

	const env = {};

	if (memory) {
		env.memory = memory;
	}

	return {
		env,
		"odin_env": {
			write: (fd, ptr, len) => {
				const str = wasmMemoryInterface.loadString(ptr, len);
				if (fd == 1) {
					writeToConsole(str, false);
					return;
				} else if (fd == 2) {
					writeToConsole(str, true);
					return;
				} else {
					throw new Error("Invalid fd to 'write'" + stripNewline(str));
				}
			},
			trap: () => { throw new Error() },
			alert: (ptr, len) => { alert(wasmMemoryInterface.loadString(ptr, len)) },
			abort: () => { Module.abort() },
			evaluate: (str_ptr, str_len) => { eval.call(null, wasmMemoryInterface.loadString(str_ptr, str_len)); },

			open: (url_ptr, url_len, name_ptr, name_len, specs_ptr, specs_len) => {
				const url = wasmMemoryInterface.loadString(url_ptr, url_len);
				const name = wasmMemoryInterface.loadString(name_ptr, name_len);
				const specs = wasmMemoryInterface.loadString(specs_ptr, specs_len);
				window.open(url, name, specs);
			},

			// return a bigint to be converted to i64
			time_now: () => BigInt(Date.now()),
			tick_now: () => performance.now(),
			time_sleep: (duration_ms) => {
				if (duration_ms > 0) {
					// TODO(bill): Does this even make any sense?
				}
			},

			sqrt:    Math.sqrt,
			sin:     Math.sin,
			cos:     Math.cos,
			pow:     Math.pow,
			fmuladd: (x, y, z) => x*y + z,
			ln:      Math.log,
			exp:     Math.exp,
			ldexp:   (x, exp) => x * Math.pow(2, exp),

			rand_bytes: (ptr, len) => {
				const view = new Uint8Array(wasmMemoryInterface.memory.buffer, ptr, len)
				if (wasmMemoryInterface.isShared) {
					const tmp = new Uint8Array(len)
					crypto.getRandomValues(tmp)
					view.set(tmp)
					return
				}
				crypto.getRandomValues(view)
			},
		},
		"odin_dom": {
			init_event_raw: (ep) => {
				const W = wasmMemoryInterface.intSize;
				let offset = ep;
				let off = (amount, alignment) => {
					if (alignment === undefined) {
						alignment = Math.min(amount, W);
					}
					if (offset % alignment != 0) {
						offset += alignment - (offset%alignment);
					}
					let x = offset;
					offset += amount;
					return x;
				};

				let align = (alignment) => {
					const modulo = offset & (alignment-1);
					if (modulo != 0) {
						offset += alignment - modulo
					}
				};

				let wmi = wasmMemoryInterface;

				if (!event_temp.data) {
					return;
				}

				let e = event_temp.data.event;

				wmi.storeU32(off(4), event_temp.data.name_code);
				if (e.target == document) {
					wmi.storeU32(off(4), 1);
				} else if (e.target == window) {
					wmi.storeU32(off(4), 2);
				} else {
					wmi.storeU32(off(4), 0);
				}
				if (e.currentTarget == document) {
					wmi.storeU32(off(4), 1);
				} else if (e.currentTarget == window) {
					wmi.storeU32(off(4), 2);
				} else {
					wmi.storeU32(off(4), 0);
				}

				align(W);

				wmi.storeI32(off(W), event_temp.data.id_ptr);
				wmi.storeUint(off(W), event_temp.data.id_len);

				align(8);
				wmi.storeF64(off(8), e.timeStamp*1e-3);

				wmi.storeU8(off(1), e.eventPhase);
				let options = 0;
				if (!!e.bubbles)    { options |= 1<<0; }
				if (!!e.cancelable) { options |= 1<<1; }
				if (!!e.composed)   { options |= 1<<2; }
				wmi.storeU8(off(1), options);
				wmi.storeU8(off(1), !!e.isComposing);
				wmi.storeU8(off(1), !!e.isTrusted);

				align(8);
				if (e instanceof WheelEvent) {
					wmi.storeF64(off(8), e.deltaX);
					wmi.storeF64(off(8), e.deltaY);
					wmi.storeF64(off(8), e.deltaZ);
					wmi.storeU32(off(4), e.deltaMode);
				} else if (e instanceof MouseEvent) {
					wmi.storeI64(off(8), e.screenX);
					wmi.storeI64(off(8), e.screenY);
					wmi.storeI64(off(8), e.clientX);
					wmi.storeI64(off(8), e.clientY);
					wmi.storeI64(off(8), e.offsetX);
					wmi.storeI64(off(8), e.offsetY);
					wmi.storeI64(off(8), e.pageX);
					wmi.storeI64(off(8), e.pageY);
					wmi.storeI64(off(8), e.movementX);
					wmi.storeI64(off(8), e.movementY);

					wmi.storeU8(off(1), !!e.ctrlKey);
					wmi.storeU8(off(1), !!e.shiftKey);
					wmi.storeU8(off(1), !!e.altKey);
					wmi.storeU8(off(1), !!e.metaKey);

					wmi.storeI16(off(2), e.button);
					wmi.storeU16(off(2), e.buttons);

					if (e instanceof PointerEvent) {
						wmi.storeF64(off(8), e.altitudeAngle);
						wmi.storeF64(off(8), e.azimuthAngle);
						wmi.storeInt(off(W), e.persistentDeviceId);
						wmi.storeInt(off(W), e.pointerId);
						wmi.storeInt(off(W), e.width);
						wmi.storeInt(off(W), e.height);
						wmi.storeF64(off(8), e.pressure);
						wmi.storeF64(off(8), e.tangentialPressure);
						wmi.storeF64(off(8), e.tiltX);
						wmi.storeF64(off(8), e.tiltY);
						wmi.storeF64(off(8), e.twist);
						if (e.pointerType == "pen") {
							wmi.storeU8(off(1), 1);
						} else if (e.pointerType == "touch") {
							wmi.storeU8(off(1), 2);
						} else {
							wmi.storeU8(off(1), 0);
						}
						wmi.storeU8(off(1), !!e.isPrimary);
					}

				} else if (e instanceof KeyboardEvent) {
					// Note: those strings are constructed
					// on the native side from buffers that
					// are filled later, so skip them
					const keyPtr  = off(W*2, W);
					const codePtr = off(W*2, W);

					wmi.storeU8(off(1), e.location);

					wmi.storeU8(off(1), !!e.ctrlKey);
					wmi.storeU8(off(1), !!e.shiftKey);
					wmi.storeU8(off(1), !!e.altKey);
					wmi.storeU8(off(1), !!e.metaKey);

					wmi.storeU8(off(1), !!e.repeat);

					wmi.storeI32(off(4), e.charCode);

					wmi.storeInt(off(W, W), e.key.length)
					wmi.storeInt(off(W, W), e.code.length)
					wmi.storeString(off(32, 1), e.key);
					wmi.storeString(off(32, 1), e.code);
				} else if (e.type === 'scroll') {
					wmi.storeF64(off(8, 8), window.scrollX);
					wmi.storeF64(off(8, 8), window.scrollY);
				} else if (e.type === 'visibilitychange') {
					wmi.storeU8(off(1), !document.hidden);
				} else if (e instanceof GamepadEvent) {
					const idPtr      = off(W*2, W);
					const mappingPtr = off(W*2, W);

					wmi.storeI32(off(W, W), e.gamepad.index);
					wmi.storeU8(off(1), !!e.gamepad.connected);
					wmi.storeF64(off(8, 8), e.gamepad.timestamp);

					wmi.storeInt(off(W, W), e.gamepad.buttons.length);
					wmi.storeInt(off(W, W), e.gamepad.axes.length);

					for (let i = 0; i < 64; i++) {
						if (i < e.gamepad.buttons.length) {
							let b = e.gamepad.buttons[i];
							wmi.storeF64(off(8, 8), b.value);
							wmi.storeU8(off(1),  !!b.pressed);
							wmi.storeU8(off(1),  !!b.touched);
						} else {
							off(16, 8);
						}
					}
					for (let i = 0; i < 16; i++) {
						if (i < e.gamepad.axes.length) {
							let a = e.gamepad.axes[i];
							wmi.storeF64(off(8, 8), a);
						} else {
							off(8, 8);
						}
					}

					let idLength = e.gamepad.id.length;
					let id = e.gamepad.id;
					if (idLength > 96) {
						idLength = 96;
						id = id.slice(0, 93) + '...';
					}

					let mappingLength = e.gamepad.mapping.length;
					let mapping = e.gamepad.mapping;
					if (mappingLength > 64) {
						mappingLength = 61;
						mapping = mapping.slice(0, 61) + '...';
					}

					wmi.storeInt(off(W, W), idLength);
					wmi.storeInt(off(W, W), mappingLength);
					wmi.storeString(off(96, 1), id);
					wmi.storeString(off(64, 1), mapping);
				}
			},

			add_event_listener: (id_ptr, id_len, name_ptr, name_len, name_code, data, callback, use_capture) => {
				let id = wasmMemoryInterface.loadString(id_ptr, id_len);
				let name = wasmMemoryInterface.loadString(name_ptr, name_len);
				let element = getElement(id);
				if (element == undefined) {
					return false;
				}
				let key = listener_key(id, name, data, callback, !!use_capture);
				if (wasmMemoryInterface.listenerMap.has(key)) {
					return false;
				}

				let listener = (e) => {
					let event_data = {};
					event_data.id_ptr = id_ptr;
					event_data.id_len = id_len;
					event_data.event = e;
					event_data.name_code = name_code;

					onEventReceived(event_data, data, callback);
				};
				wasmMemoryInterface.listenerMap.set(key, listener);
				element.addEventListener(name, listener, !!use_capture);
				return true;
			},

			add_window_event_listener: (name_ptr, name_len, name_code, data, callback, use_capture) => {
				let name = wasmMemoryInterface.loadString(name_ptr, name_len);
				let element = window;
				let key = listener_key('window', name, data, callback, !!use_capture);
				if (wasmMemoryInterface.listenerMap.has(key)) {
					return false;
				}

				let listener = (e) => {
					let event_data = {};
					event_data.id_ptr = 0;
					event_data.id_len = 0;
					event_data.event = e;
					event_data.name_code = name_code;

					onEventReceived(event_data, data, callback);
				};
				wasmMemoryInterface.listenerMap.set(key, listener);
				element.addEventListener(name, listener, !!use_capture);
				return true;
			},

			add_document_event_listener: (name_ptr, name_len, name_code, data, callback, use_capture) => {
				let name = wasmMemoryInterface.loadString(name_ptr, name_len);
				let element = document;
				let key = listener_key('document', name, data, callback, !!use_capture);
				if (wasmMemoryInterface.listenerMap.has(key)) {
					return false;
				}

				let listener = (e) => {
					let event_data = {};
					event_data.id_ptr = 0;
					event_data.id_len = 0;
					event_data.event = e;
					event_data.name_code = name_code;

					onEventReceived(event_data, data, callback);
				};
				wasmMemoryInterface.listenerMap.set(key, listener);
				element.addEventListener(name, listener, !!use_capture);
				return true;
			},

			remove_event_listener: (id_ptr, id_len, name_ptr, name_len, data, callback, use_capture) => {
				let id = wasmMemoryInterface.loadString(id_ptr, id_len);
				let name = wasmMemoryInterface.loadString(name_ptr, name_len);
				let element = getElement(id);
				if (element == undefined) {
					return false;
				}

				let key = listener_key(id, name, data, callback, !!use_capture);
				let listener = wasmMemoryInterface.listenerMap.get(key);
				if (listener === undefined) {
					return false;
				}
				wasmMemoryInterface.listenerMap.delete(key);

				element.removeEventListener(name, listener, !!use_capture);
				return true;
			},
			remove_window_event_listener: (name_ptr, name_len, data, callback, use_capture) => {
				let name = wasmMemoryInterface.loadString(name_ptr, name_len);
				let element = window;

				let key = listener_key('window', name, data, callback, !!use_capture);
				let listener = wasmMemoryInterface.listenerMap.get(key);
				if (listener === undefined) {
					return false;
				}
				wasmMemoryInterface.listenerMap.delete(key);

				element.removeEventListener(name, listener, !!use_capture);
				return true;
			},
			remove_document_event_listener: (name_ptr, name_len, data, callback, use_capture) => {
				let name = wasmMemoryInterface.loadString(name_ptr, name_len);
				let element = document;

				let key = listener_key('document', name, data, callback, !!use_capture);
				let listener = wasmMemoryInterface.listenerMap.get(key);
				if (listener === undefined) {
					return false;
				}
				wasmMemoryInterface.listenerMap.delete(key);

				element.removeEventListener(name, listener, !!use_capture);
				return true;
			},

			event_stop_propagation: () => {
				if (event_temp.data && event_temp.data.event) {
					event_temp.data.event.stopPropagation();
				}
			},
			event_stop_immediate_propagation: () => {
				if (event_temp.data && event_temp.data.event) {
					event_temp.data.event.stopImmediatePropagation();
				}
			},
			event_prevent_default: () => {
				if (event_temp.data && event_temp.data.event) {
					event_temp.data.event.preventDefault();
				}
			},

			dispatch_custom_event: (id_ptr, id_len, name_ptr, name_len, options_bits) => {
				let id = wasmMemoryInterface.loadString(id_ptr, id_len);
				let name = wasmMemoryInterface.loadString(name_ptr, name_len);
				let options = {
					bubbles:    (options_bits & (1<<0)) !== 0,
					cancelable: (options_bits & (1<<1)) !== 0,
					composed:   (options_bits & (1<<2)) !== 0,
				};

				let element = getElement(id);
				if (element) {
					element.dispatchEvent(new Event(name, options));
					return true;
				}
				return false;
			},

			// Writes a struct of type `Gamepad_State`, see `core/sys/wasm/js/events.odin`
			get_gamepad_state: (gamepad_id, ep) => {
				let index = gamepad_id;
				let gps = navigator.getGamepads();
				if (0 <= index && index < gps.length) {
					let gamepad = gps[index];
					if (!gamepad) {
						return false;
					}

					const W = wasmMemoryInterface.intSize;
					let offset = ep;
					let off = (amount, alignment) => {
						if (alignment === undefined) {
							alignment = Math.min(amount, W);
						}
						if (offset % alignment != 0) {
							offset += alignment - (offset%alignment);
						}
						let x = offset;
						offset += amount;
						return x;
					};

					let align = (alignment) => {
						const modulo = offset & (alignment-1);
						if (modulo != 0) {
							offset += alignment - modulo
						}
					};

					let wmi = wasmMemoryInterface;

					const idPtr      = off(W*2, W);
					const mappingPtr = off(W*2, W);

					wmi.storeI32(off(W), gamepad.index);
					wmi.storeU8(off(1), !!gamepad.connected);
					wmi.storeF64(off(8), gamepad.timestamp);

					wmi.storeInt(off(W), gamepad.buttons.length);
					wmi.storeInt(off(W), gamepad.axes.length);

					for (let i = 0; i < 64; i++) {
						if (i < gamepad.buttons.length) {
							let b = gamepad.buttons[i];
							wmi.storeF64(off(8, 8), b.value);
							wmi.storeU8(off(1),  !!b.pressed);
							wmi.storeU8(off(1),  !!b.touched);
						} else {
							off(16, 8);
						}
					}
					for (let i = 0; i < 16; i++) {
						if (i < gamepad.axes.length) {
							wmi.storeF64(off(8, 8), gamepad.axes[i]);
						} else {
							off(8, 8);
						}
					}

					let idLength = gamepad.id.length;
					let id = gamepad.id;
					if (idLength > 96) {
						idLength = 96;
						id = id.slice(0, 93) + '...';
					}

					let mappingLength = gamepad.mapping.length;
					let mapping = gamepad.mapping;
					if (mappingLength > 64) {
						mappingLength = 61;
						mapping = mapping.slice(0, 61) + '...';
					}

					wmi.storeInt(off(W, W), idLength);
					wmi.storeInt(off(W, W), mappingLength);
					wmi.storeString(off(96, 1), id);
					wmi.storeString(off(64, 1), mapping);

					return true;
				}
				return false;
			},

			get_element_value_f64: (id_ptr, id_len) => {
				let id = wasmMemoryInterface.loadString(id_ptr, id_len);
				let element = getElement(id);
				return element ? element.value : 0;
			},
			get_element_value_string: (id_ptr, id_len, buf_ptr, buf_len) => {
				let id = wasmMemoryInterface.loadString(id_ptr, id_len);
				let element = getElement(id);
				if (element) {
					let str = element.value;
					if (buf_len > 0 && buf_ptr) {
						let n = Math.min(buf_len, str.length);
						str = str.substring(0, n);
						wasmMemoryInterface.loadBytes(buf_ptr, buf_len).set(new TextEncoder().encode(str))
						return n;
					}
				}
				return 0;
			},
			get_element_value_string_length: (id_ptr, id_len) => {
				let id = wasmMemoryInterface.loadString(id_ptr, id_len);
				let element = getElement(id);
				if (element) {
					return element.value.length;
				}
				return 0;
			},
			get_element_min_max: (ptr_array2_f64, id_ptr, id_len) => {
				let id = wasmMemoryInterface.loadString(id_ptr, id_len);
				let element = getElement(id);
				if (element) {
					let values = wasmMemoryInterface.loadF64Array(ptr_array2_f64, 2);
					values[0] = element.min;
					values[1] = element.max;
				}
			},
			set_element_value_f64: (id_ptr, id_len, value) => {
				let id = wasmMemoryInterface.loadString(id_ptr, id_len);
				let element = getElement(id);
				if (element) {
					element.value = value;
				}
			},
			set_element_value_string: (id_ptr, id_len, value_ptr, value_len) => {
				let id = wasmMemoryInterface.loadString(id_ptr, id_len);
				let value = wasmMemoryInterface.loadString(value_ptr, value_len);
				let element = getElement(id);
				if (element) {
					element.value = value;
				}
			},

			set_element_style: (id_ptr, id_len, key_ptr, key_len, value_ptr, value_len) => {
				let id = wasmMemoryInterface.loadString(id_ptr, id_len);
				let key = wasmMemoryInterface.loadString(key_ptr, key_len);
				let value = wasmMemoryInterface.loadString(value_ptr, value_len);
				let element = getElement(id);
				if (element) {
					element.style[key] = value;
				}
			},

			set_document_title: (title_ptr, title_len) => {
				let title = wasmMemoryInterface.loadString(title_ptr, title_len);
				document.title = title;
			},

			get_element_key_f64: (id_ptr, id_len, key_ptr, key_len) => {
				let id = wasmMemoryInterface.loadString(id_ptr, id_len);
				let key = wasmMemoryInterface.loadString(key_ptr, key_len);
				let element = getElement(id);
				return element ? element[key] : 0;
			},
			get_element_key_string: (id_ptr, id_len, key_ptr, key_len, buf_ptr, buf_len) => {
				let id = wasmMemoryInterface.loadString(id_ptr, id_len);
				let key = wasmMemoryInterface.loadString(key_ptr, key_len);
				let element = getElement(id);
				if (element) {
					let str = element[key];
					if (buf_len > 0 && buf_ptr) {
						let n = Math.min(buf_len, str.length);
						str = str.substring(0, n);
						wasmMemoryInterface.loadBytes(buf_ptr, buf_len).set(new TextEncoder().encode(str))
						return n;
					}
				}
				return 0;
			},
			get_element_key_string_length: (id_ptr, id_len, key_ptr, key_len) => {
				let id = wasmMemoryInterface.loadString(id_ptr, id_len);
				let key = wasmMemoryInterface.loadString(key_ptr, key_len);
				let element = getElement(id);
				if (element && element[key]) {
					return element[key].length;
				}
				return 0;
			},

			set_element_key_f64: (id_ptr, id_len, key_ptr, key_len, value) => {
				let id = wasmMemoryInterface.loadString(id_ptr, id_len);
				let key = wasmMemoryInterface.loadString(key_ptr, key_len);
				let element = getElement(id);
				if (element) {
					element[key] = value;
				}
			},
			set_element_key_string: (id_ptr, id_len, key_ptr, key_len, value_ptr, value_len) => {
				let id = wasmMemoryInterface.loadString(id_ptr, id_len);
				let key = wasmMemoryInterface.loadString(key_ptr, key_len);
				let value = wasmMemoryInterface.loadString(value_ptr, value_len);
				let element = getElement(id);
				if (element) {
					element[key] = value;
				}
			},


			get_bounding_client_rect: (rect_ptr, id_ptr, id_len) => {
				let id = wasmMemoryInterface.loadString(id_ptr, id_len);
				let element = getElement(id);
				if (element) {
					let values = wasmMemoryInterface.loadF64Array(rect_ptr, 4);
					let rect = element.getBoundingClientRect();
					values[0] = rect.left;
					values[1] = rect.top;
					values[2] = rect.right  - rect.left;
					values[3] = rect.bottom - rect.top;
				}
			},
			window_get_rect: (rect_ptr) => {
				let values = wasmMemoryInterface.loadF64Array(rect_ptr, 4);
				values[0] = window.screenX;
				values[1] = window.screenY;
				values[2] = window.screen.width;
				values[3] = window.screen.height;
			},

			window_get_scroll: (pos_ptr) => {
				let values = wasmMemoryInterface.loadF64Array(pos_ptr, 2);
				values[0] = window.scrollX;
				values[1] = window.scrollY;
			},
			window_set_scroll: (x, y) => {
				window.scroll(x, y);
			},

			device_pixel_ratio: () => {
				return window.devicePixelRatio;
			},

		},

		"webgl": webglContext.getWebGL1Interface(),
		"webgl2": webglContext.getWebGL2Interface(),
	};
};

/**
 * @param {string} wasmPath                          - Path to the WASM module to run
 * @param {?HTMLPreElement} consoleElement           - Optional console/pre element to append output to, in addition to the console
 * @param {any} extraForeignImports                  - Imports, in addition to the default runtime to provide the module
 * @param {?WasmMemoryInterface} wasmMemoryInterface - Optional memory to use instead of the defaults
 * @param {?int} intSize                             - Size (in bytes) of the integer type, should be 4 on `js_wasm32` and 8 on `js_wasm64p32`
 */
async function runWasm(wasmPath, consoleElement, extraForeignImports, wasmMemoryInterface, intSize = 4) {
	if (!wasmMemoryInterface) {
		wasmMemoryInterface = new WasmMemoryInterface();
	}
	wasmMemoryInterface.setIntSize(intSize);

	let imports = odinSetupDefaultImports(wasmMemoryInterface, consoleElement, wasmMemoryInterface.memory);
	let exports = {};

	if (extraForeignImports !== undefined) {
		imports = {
			...imports,
			...extraForeignImports,
		};
	}

	const response = await fetch(wasmPath);
	const file = await response.arrayBuffer();
	const wasm = await WebAssembly.instantiate(file, imports);
	exports = wasm.instance.exports;
	wasmMemoryInterface.setExports(exports);

	if (exports.memory) {
		if (wasmMemoryInterface.memory) {
			console.warn('WASM module exports memory, but `runWasm` was given an interface with existing memory too. Did you mean to use `-extra-linker-flags:"--import-memory"` to tell the compiler not to export memory?');
		}
		wasmMemoryInterface.setMemory(exports.memory);
	}

	if (exports._start) {
		exports._start();
	}

	// Define a `@export step :: proc(delta_time: f64) -> (keep_going: bool) {`
	// in your app and it will get called every frame.
	// return `false` to stop the execution of the module.
	if (exports.step) {
		const odin_ctx = exports.default_context_ptr();

		let prevTimeStamp = undefined;
		function step(currTimeStamp) {
			if (prevTimeStamp == undefined) {
				prevTimeStamp = currTimeStamp;
			}

			const dt = (currTimeStamp - prevTimeStamp)*0.001;
			prevTimeStamp = currTimeStamp;

			if (!exports.step(dt, odin_ctx)) {
				if (exports._end) {
					exports._end();
				}
				return;
			}

			window.requestAnimationFrame(step);
		}

		window.requestAnimationFrame(step);
	} else {
		if (exports._end) {
			exports._end();
		}
	}

	return;
};

window.odin = {
	// Interface Types
	WasmMemoryInterface: WasmMemoryInterface,
	WebGLInterface:      WebGLInterface,

	// Functions
	setupDefaultImports: odinSetupDefaultImports,
	runWasm:             runWasm,
};
})();
</script>
<script>// The page's half of the quiz: start the wasm module, then stand in for the server.
//
// Everything the module needs arrives inlined in the one HTML file -- the gzipped wasm as base64, the
// stylesheets and the finale picture in a JSON block -- because the page has to work opened straight
// from disk, where a `file://` document may not fetch anything, not even a file next to it.
//
// The module renders the same markup the servers do, Datastar actions included. `window.fetch` is
// replaced so that a request to the module's mount point (`/__quiz/...`) never reaches the network:
// it is answered by `qz_request`, whose script comes back as a streamed `text/event-stream` body with
// its pauses waited out, which is all Datastar can see of a server anyway.
(async () => {
	"use strict";

	const PREFIX = "/__quiz";
	const encoder = new TextEncoder();
	const decoder = new TextDecoder();

	const bootMessage = (text) => {
		const element = document.getElementById("boot");
		if (element) element.textContent = text;
	};

	// -- the module --------------------------------------------------------------------------

	const gunzip = async (base64) => {
		const bytes = Uint8Array.from(atob(base64), (ch) => ch.charCodeAt(0));
		const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream("gzip"));
		return new Response(stream).arrayBuffer();
	};

	const memory = new odin.WasmMemoryInterface();
	memory.setIntSize(4);
	const imports = odin.setupDefaultImports(memory, null, memory.memory);
	const { instance } = await WebAssembly.instantiate(await gunzip(QUIZ_WASM), imports);
	const wasm = instance.exports;
	memory.setExports(wasm);
	memory.setMemory(wasm.memory);
	wasm._start();

	const bytesAt = (pointer, length) => new Uint8Array(wasm.memory.buffer, pointer, length);
	const put = (text) => {
		const bytes = encoder.encode(text);
		const pointer = wasm.qz_alloc(bytes.length);
		bytesAt(pointer, bytes.length).set(bytes);
		return [pointer, bytes.length];
	};

	// The corpus travels beside the module, not inside it -- see `src/main.odin`. Parsed and indexed
	// here, once.
	const systems = JSON.parse(document.getElementById("quiz-corpus").textContent);
	if (!Array.isArray(systems) || systems.length === 0) throw new Error("this page carries no quiz corpus");
	// A system can carry its NOTES as a whole html document (a quiz the notes workbench generated has no
	// published page to embed). Lifted out here - the engine has no use for it - and given to the "System
	// Notes" panel as a local copy below; `system_notes_url` names that copy (`/__quiz/notes/<i>`).
	const notesPages = systems.map((system) => system.system_notes_html || "");
	for (const system of systems) {
		const { system_notes_html: _, ...forEngine } = system;
		wasm.qz_add_system(...put(JSON.stringify(forEngine)));
	}
	if (!wasm.qz_start()) throw new Error("the quiz corpus did not load");

	// One request, start to finish, synchronously. The request is
	// `METHOD\nPATH\nQUERY\nCOOKIE\nBODY`; see `src/main.odin`.
	const ask = (method, path, query, body) => {
		let cookie = "";
		try {
			cookie = document.cookie;
		} catch {
			// an opaque origin can refuse cookies outright
		}
		const length = wasm.qz_request(...put([method, path, query, cookie, body].join("\n")));
		return decoder.decode(bytesAt(wasm.qz_result(), length).slice());
	};

	// -- the assets ----------------------------------------------------------------------------

	const ASSETS = JSON.parse(document.getElementById("quiz-assets").textContent);
	const assetUrls = new Map();
	const blobUrl = (bytes, type) => URL.createObjectURL(new Blob([bytes], { type }));

	for (const [name, text] of Object.entries(ASSETS.css)) {
		assetUrls.set(`${PREFIX}/static/${name}`, blobUrl(text, "text/css"));
	}
	for (const [name, base64] of Object.entries(ASSETS.media)) {
		const bytes = Uint8Array.from(atob(base64), (ch) => ch.charCodeAt(0));
		assetUrls.set(`${PREFIX}/media/${name}`, blobUrl(bytes, "image/jpeg"));
	}
	assetUrls.set(`${PREFIX}/static/datastar.js`, blobUrl(ASSETS.datastar, "text/javascript"));
	notesPages.forEach((html, index) => {
		if (html) assetUrls.set(`${PREFIX}/notes/${index}`, blobUrl(html, "text/html"));
	});

	// The sounds are synthesised by the module at boot, as the servers do, rather than shipped.
	const sizeCell = wasm.qz_alloc(4);
	for (let index = 0; index < wasm.qz_sound_count(); index++) {
		const namePointer = wasm.qz_sound_name(index, sizeCell);
		const name = decoder.decode(bytesAt(namePointer, new Int32Array(wasm.memory.buffer, sizeCell, 1)[0]).slice());
		const wavPointer = wasm.qz_sound_bytes(index, sizeCell);
		const wav = bytesAt(wavPointer, new Int32Array(wasm.memory.buffer, sizeCell, 1)[0]).slice();
		assetUrls.set(`${PREFIX}/sfx/${name}?v=wasm`, blobUrl(wav, "audio/wav"));
	}

	// Asset URLs are rewritten in the TEXT -- the page, and every patch streamed into it, since the
	// finale's picture arrives in one -- never on the live DOM. A MutationObserver on `href`/`src` was
	// tried first and hung the tab: Datastar re-applies `data-attr:href` when the attribute changes, the
	// observer changed it back, and the two took turns forever.
	//
	// The one URL a literal rewrite cannot reach is the stylesheet picker's, which Datastar BUILDS
	// (`'/__quiz/static/app-' + $_css + '.css'`). The picker is a debug-only affordance, so this page
	// drops the binding and keeps the default sheet.
	const rewrite = (html) => {
		html = html.replace(/(<link rel="stylesheet") data-attr:href="[^"]*"/, "$1");
		for (const [from, to] of assetUrls) html = html.split(from).join(to);
		return html;
	};

	// -- the server, in the page --------------------------------------------------------------

	const sleep = (ms, signal) =>
		new Promise((resolve) => {
			const timer = setTimeout(resolve, ms);
			signal?.addEventListener("abort", () => {
				clearTimeout(timer);
				resolve();
			});
		});

	// An SSE body that plays the script out: events between NULs are sent at once, the field after
	// each NUL is a pause in milliseconds.
	const streamScript = (sse, signal) => {
		const fields = sse.split("\0");
		return new ReadableStream({
			async start(controller) {
				for (let index = 0; index < fields.length; index++) {
					if (signal?.aborted) break;
					if (index % 2 === 1) {
						await sleep(Number(fields[index]), signal);
					} else if (fields[index] !== "") {
						controller.enqueue(encoder.encode(fields[index]));
					}
				}
				controller.close();
			},
		});
	};

	const networkFetch = window.fetch.bind(window);
	window.fetch = async (input, init = {}) => {
		const url = new URL(typeof input === "string" ? input : input.url, location.href);
		const at = url.pathname.indexOf(`${PREFIX}/`);
		if (at < 0) return networkFetch(input, init);

		const method = (init.method || "GET").toUpperCase();
		const body = typeof init.body === "string" ? init.body : "";
		const answer = ask(method, url.pathname.slice(at + PREFIX.length), url.search.slice(1), body);

		switch (answer[0]) {
			case "S":
				return new Response(streamScript(rewrite(answer.slice(1)), init.signal), {
					status: 200,
					headers: { "Content-Type": "text/event-stream" },
				});
			case "D":
				return new Response(answer.slice(1), { status: 200, headers: { "Content-Type": "text/html" } });
			default:
				return new Response(null, { status: 204 });
		}
	};

	// -- the page ------------------------------------------------------------------------------

	bootMessage("Rendering…");
	const page = ask("GET", "/", location.search.slice(1), "");
	if (page[0] !== "D") {
		bootMessage("The quiz could not start: the module rendered no page.");
		return;
	}
	// `document.open` keeps this window -- and so the `fetch` above -- and replaces only the document.
	document.open();
	document.write(rewrite(page.slice(1)));
	document.close();
})().catch((error) => {
	console.error(error);
	const element = document.getElementById("boot");
	if (element) element.textContent = `The quiz could not start: ${error}`;
});
</script>
