to:translate(0.25rem, -50%);transform:translate(-.75rem,-50%);animation-name:tooltip-slide}[data-tooltip][data-placement=right]:focus::after,[data-tooltip][data-placement=right]:hover::after{--pico-tooltip-caret-slide-to:translate(-0.3rem, -50%);transform:translate(-.05rem,-50%);animation-name:tooltip-caret-slide}}@keyframes tooltip-slide{to{transform:var(--pico-tooltip-slide-to);opacity:1}}@keyframes tooltip-caret-slide{50%{opacity:0}to{transform:var(--pico-tooltip-caret-slide-to);opacity:1}}[aria-controls]{cursor:pointer}[aria-disabled=true],[disabled]{cursor:not-allowed}[aria-hidden=false][hidden]{display:initial}[aria-hidden=false][hidden]:not(:focus){clip:rect(0,0,0,0);position:absolute}[tabindex],a,area,button,input,label,select,summary,textarea{-ms-touch-action:manipulation}[dir=rtl]{direction:rtl}@media (prefers-reduced-motion:reduce){:not([aria-busy=true]),:not([aria-busy=true])::after,:not([aria-busy=true])::before{background-attachment:initial!important;animation-duration:1ms!important;animation-delay:-1ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important;transition-delay:0s!important;transition-duration:0s!important}}\n/* The Pico half of the CSS A/B (see DESIGN.md, and the Base picker in the sidebar).\n *\n * Pico classless styles the elements we already emit -- body type, headings, buttons, inputs,\n * select, <details>, <dialog>, <kbd>, focus rings, light/dark -- so everything in here is what a\n * base stylesheet CANNOT know: this app's layout, its domain colours, and the four widgets panel\n * used to provide. That division is the point of the experiment: this file's length against\n * app.css's is the honest measure of what adopting a base buys.\n *\n * Deliberately NOT here (Pico covers it): button / input / select / textarea styling, typography and\n * spacing scale, <details> disclosure, <dialog> chrome, <kbd>, focus-visible, colour scheme.\n */\n\n/* RELATIVE, not `/static/...`: an @import resolves against the STYLESHEET's own URL, which is the\n   only URL in this app that the deployment prefix does not have to be pasted into by hand. Rooted at\n   `/static/` it 404s the moment the app is served under a prefix (`/bridge-system-quiz/static/...`),\n   and the failure is silent and mid-page: every `--pico-*` token vanishes, so `.card` fell through\n   to its `#fff` fallback and sat white on a dark canvas -- dark mode looked broken while the rest of\n   the page, which uses this sheet's own tokens, looked fine. */\n\n\n:root {\n  --primary: light-dark(#14564a, #123f36);\n  --primary-dark: light-dark(#0e3f37, #0b2b25);\n  --card-accent: light-dark(#2e8b57, #3fae6d);\n  --face: light-dark(#fdfcf7, #1d2724);\n  /* The surface ladder -- see the long note in `app.css`. Short version: the answer cards were\n     1.03:1 against the surface behind them, `--face` cannot change (the suit colours are pinned to\n     it), and a fill difference cannot reach 3:1 up in the near-whites. So the cards sit in a\n     recessed well and carry a 3.17:1 border of their own. Restated here rather than inherited,\n     because each stylesheet is standalone by design. */\n  --well: light-dark(#e0e9e4, #0e1613);\n  --card-edge: light-dark(#7f938b, #6b7d76);\n  --meter-empty: light-dark(#e3eeea, #26332e);\n  /* darkened from bml.css's values -- see tests/test_suit_colours.py */\n  --suit-club: light-dark(#1e7a45, #4bbd7a);\n  --suit-diamond: light-dark(#b35300, #ff9d3d);\n  --suit-heart: light-dark(#cc0000, #ff6b6b);\n  --suit-spade: light-dark(#000000, #e8eff0);\n  --ui-font: \"Open Sans\", \"Segoe UI\", system-ui, -apple-system, Roboto, var(--suit-symbols), sans-serif;\n  --display-font: \"Nunito\", \"Trebuchet MS\", \"Segoe UI\", system-ui, var(--suit-symbols), sans-serif;\n  /* hand Pico our font choice, so the picker still works */\n  --pico-font-family: var(--ui-font);\n  --pico-border-radius: 10px;\n  /* the panel/card surface, lifted from Bulma's `.box` -- see the `.panel, .card` rule below */\n  --panel-radius: 0.75rem;\n  /* Pico ramps the ROOT font size with the viewport -- 100% up to 131.25% at >=1536px -- so on a wide\n     monitor everything rendered ~31% larger than the hand-rolled stylesheet and the variant looked\n     \"zoomed in\". Fluid typography is a reasonable default for a text site; here it makes the A/B\n     incomparable, since the point is to compare component styling and not type scale. Pinned. */\n  --pico-font-size: 100%;\n  /* Pico ships its own dark theme; the block at the bottom of this file supplies the tokens it\n     cannot know, so `light dark` is honest here too. */\n  /* the app bar's height, so the sidebar's own scroll region -- and the sticky countdown on a\n     phone -- can be sized off it rather than off a guess; being 13px out was enough to put a\n     scrollbar back on the page.\n     3.875rem = 62px = the hamburger's 44px touch target plus the bar's 0.55rem of padding, which\n     is what the bar has ACTUALLY measured since the touch targets went in. It said 3rem for\n     months, so the drawer opened 14px under the bar and anything sticking to `--topbar-h` would\n     have hidden behind it. A coarse pointer lands on the same number (Skip and the theme toggle\n     grow to the same 44px floor), so one value is right for both. */\n  --topbar-h: 3.875rem;\n  /* ELEVATION -- one light, overhead. Every rung is `x = 0`, `blur = 2x offset`, and each is a\n     DIRECT cast plus a tighter AMBIENT one (contact occlusion, half the offset). Depth only reads as\n     depth while every shadow on the page agrees about where the light is; before this the app had\n     seven ad-hoc alphas, a drawer lit from nowhere (`0 0 40px`) and Pico's own left-lit, blue-tinted\n     shadow under the notes. Rungs: 1 things resting on a surface (answer cards, disclosures), 2 the\n     panels and the quiz card, 3 what floats over them (toasts, a lifted card), 4 what covers them\n     (dialog, mobile drawer). See DESIGN.md \"Elevation and shadow\".\n     The cast takes the ink's hue rather than pure black: a neutral-black shadow over a tinted page\n     reads as dirt. */\n  /* Both palettes, one declaration each, via `light-dark()` -- see the theming note above. Dark\n     inverts the job: a cast shadow barely registers on a dark ground, so elevation there is carried\n     by LIGHTENING the surface and these mostly hold an edge. The alphas roughly double and rung 1's\n     hairline flips from a dark ring to a light one; the GEOMETRY is identical, so nothing changes\n     rung when the scheme flips. */\n  --elev-inset: inset 0 2px 6px light-dark(rgb(18 33 26 / 10%), rgb(0 0 0 / 35%));\n  --elev-1:\n    0 1px 2px light-dark(rgb(18 33 26 / 10%), rgb(0 0 0 / 30%)),\n    0 0 0 1px light-dark(rgb(18 33 26 / 4%), rgb(230 239 233 / 7%));\n  --elev-2:\n    0 4px 8px light-dark(rgb(18 33 26 / 12%), rgb(0 0 0 / 35%)),\n    0 2px 4px light-dark(rgb(18 33 26 / 8%), rgb(0 0 0 / 25%));\n  --elev-3:\n    0 8px 16px light-dark(rgb(18 33 26 / 16%), rgb(0 0 0 / 45%)),\n    0 4px 8px light-dark(rgb(18 33 26 / 10%), rgb(0 0 0 / 28%));\n  --elev-4:\n    0 16px 32px light-dark(rgb(18 33 26 / 30%), rgb(0 0 0 / 60%)),\n    0 8px 16px light-dark(rgb(18 33 26 / 18%), rgb(0 0 0 / 35%));\n  /* TYPE, in two roles -- DESIGN.md \"Type: three roles, and only one of them may have personality\".\n     `--ui-font` is what you READ: the prompt, the five answers, every control. It is what the\n     Appearance picker changes, because a reading face is a legitimate preference.\n     `--display-font` is the game's VOICE: app bar, HUD numbers, toasts, the finale. Personality is\n     nearly free on three words seen a hundred times and expensive on a sentence read against a\n     clock, so it lives here and nowhere else. Rounded terminals are the cheapest \"this is a game,\n     not a form\" signal there is, and cost no legibility on a humanist face.\n     `--suit-symbols` sits in EVERY stack, before the generic: the suits are text glyphs, and a face\n     without them falls back silently -- so a spade could arrive in a different font from the bid\n     beside it. Naming the symbol fonts makes that fallback deterministic instead of last-resort.\n     Nothing may follow a generic family in a stack; a generic always matches. */\n  --suit-symbols: \"Segoe UI Symbol\", \"Noto Sans Symbols2\", \"DejaVu Sans\";\n  color-scheme: light dark;\n  scrollbar-color: light-dark(rgb(20 86 74 / 35%), rgb(230 239 233 / 30%)) transparent;\n}\n\n/* Pico's primary was #0172ad, so the Apply button, the ticked checkboxes, the links and every focus\n   ring came out blue under a green app bar -- the variant read as two colour languages at once. Pico\n   derives hover / border / underline from these, so re-tinting is six declarations rather than a hunt\n   through the components.\n   On `body`, NOT `:root`: Pico declares these under `:root:not([data-theme=dark])`, specificity\n   (0,1,1), which beats a plain `:root` -- the first attempt changed nothing at all. Custom properties\n   inherit, so declaring them one level down wins without having to mirror Pico's theme selectors, and\n   it works the same in both palettes. */\n/* The canvas, restated. Pico does set a background on `:root`, so this is belt-and-braces rather\n   than a fix -- but it is the rule the other two sheets need (see `app.css`), and a variant that\n   silently relied on the framework for it would break the moment the framework changed. */\nhtml {\n  min-height: 100%;\n  background: var(--pico-background-color);\n}\n\nbody {\n  --pico-primary: light-dark(#14564a, #7fc8a4);\n  --pico-primary-background: light-dark(#14564a, #1d6b56);\n  --pico-primary-border: light-dark(#14564a, #1d6b56);\n  --pico-primary-hover: light-dark(#0e3f37, #a9d8bf);\n  --pico-primary-hover-background: light-dark(#0e3f37, #248065);\n  --pico-primary-underline: light-dark(rgb(20 86 74 / 50%), rgb(127 200 164 / 50%));\n  --pico-primary-focus: light-dark(rgb(20 86 74 / 37.5%), rgb(127 200 164 / 37.5%));\n  --pico-primary-inverse: #fff;\n  --pico-form-element-active-border-color: light-dark(#14564a, #7fc8a4);\n}\n\nbody[data-font=\"system\"] {\n  --ui-font: system-ui, -apple-system, \"Segoe UI\", Roboto, var(--suit-symbols), sans-serif;\n}\n\nbody[data-font=\"serif\"] {\n  --ui-font: \"Iowan Old Style\", \"Palatino Linotype\", Georgia, \"Times New Roman\", var(--suit-symbols), serif;\n}\n\nbody[data-font=\"mono\"] {\n  --ui-font: \"Cascadia Code\", \"JetBrains Mono\", Consolas, \"Courier New\", var(--suit-symbols), monospace;\n}\n\nbody[data-font=\"rounded\"] {\n  --ui-font: \"Nunito\", \"Trebuchet MS\", \"Segoe UI\", system-ui, var(--suit-symbols), sans-serif;\n}\n\n/* THE FONT PICKER HAS TO RE-RESOLVE ON <body>. The Pico font variable is declared on :root as\n   `var(--ui-font)`, and a custom property that uses var() is resolved WHERE IT IS DECLARED - so the root's\n   value was inherited unchanged and the [data-font] rules above, which set `--ui-font` on <body>, never\n   reached the text: every choice rendered as Open Sans. Naming `--ui-font` on <body> itself (and letting\n   the form controls inherit) is what makes the picker work, as the hand-written sheet always did. */\nbody {\n  font-family: var(--ui-font);\n}\n\nbutton,\ninput,\nselect,\ntextarea,\nh1, h2, h3, h4, h5, h6 {\n  font-family: inherit;\n}\n\n/* Pico treats `body > header|main|footer` as page containers: centred, padded, and capped at\n   1450px. The app bar is chrome and wants the whole width, and the layout below it is a plain div\n   that is NOT so constrained -- leaving the two misaligned until this is undone. */\nbody > header {\n  max-width: none;\n  margin: 0;\n  padding: 0;\n}\n\n/* --- suit colours (domain: no base stylesheet has a 4-colour deck) --- */\n\n.ccolor,\n.dcolor,\n.hcolor,\n.scolor {\n  font-variant-emoji: text;\n}\n\n.ccolor {\n  color: var(--suit-club);\n}\n\n.dcolor {\n  color: var(--suit-diamond);\n}\n\n.hcolor {\n  color: var(--suit-heart);\n}\n\n.scolor {\n  color: var(--suit-spade);\n}\n\n/* --- app bar --- */\n\n.topbar {\n  box-shadow: var(--elev-2);\n  position: sticky;\n  top: 0;\n  min-height: var(--topbar-h);\n  z-index: 15;\n  display: flex;\n  align-items: center;\n  gap: 0.9rem;\n  background: linear-gradient(180deg, var(--primary), var(--primary-dark));\n  color: white;\n  padding: 0.55rem 1rem;\n}\n\n.topbar h1 {\n  /* the game's voice, not the reading face -- see the type note in `:root` */\n  font-family: var(--display-font);\n  margin: 0;\n  font-size: 1.25rem;\n  /* Pico colours headings with --pico-color, which here would be the page ink on a dark bar */\n  color: inherit;\n}\n\n.topbar-spacer {\n  flex: 1;\n}\n\n.topbar-score {\n  /* the game's voice, not the reading face -- see the type note in `:root` */\n  font-family: var(--display-font);\n  font-variant-numeric: tabular-nums;\n  font-size: 0.95rem;\n  opacity: 0.9;\n  /* NOWRAP, and it does not shrink. On a 390px phone this was the widest thing the bar could not\n     fit, so it wrapped to three lines -- \"0/0\", \"· 0\", \"pts\", read vertically -- and took the bar\n     from 48px to 78px. A score is one line or it is not a score; the title is the flex item that\n     gives way (it has `min-width: 0` and an ellipsis), and below 400px the fraction drops out\n     entirely rather than the bar overflowing. */\n  white-space: nowrap;\n  flex: none;\n}\n\n.nav-toggle {\n  width: auto;\n  /* Pico gives every button `margin-bottom: var(--pico-spacing)` -- 16px, on a flex item, so it is\n     16px of the APP BAR's height. The bar was 78px tall on a phone instead of 48 and nobody could\n     see where it came from: the hamburger is 44px and the bar's padding is 8.8. Skip and the theme\n     toggle already zeroed it; this one did not. */\n  margin: 0;\n  background: transparent;\n  border: 0;\n  padding: 0.4rem;\n  line-height: 0;\n}\n\n/* The theme toggle: app-bar chrome, so it reads like the hamburger rather than like a form button.\n   Sized to a 32px floor with a mouse and 44px on a coarse pointer, same as Skip -- it sits between\n   the score and Skip, and a 24px target there is a mis-tap on the thing beside it. */\n.theme-toggle {\n  width: auto;\n  margin: 0;\n  min-height: 32px;\n  padding: 0.3rem 0.5rem;\n  border: 0;\n  border-radius: 8px;\n  background: transparent;\n  color: white;\n  font-size: 1.05rem;\n  line-height: 1;\n}\n\n@media (hover: hover) {\n  .theme-toggle:hover {\n    background: rgb(255 255 255 / 15%);\n  }\n}\n\n@media (pointer: coarse) {\n  .theme-toggle {\n    min-height: 44px;\n  }\n}\n\n.bars,\n.bars::before,\n.bars::after {\n  display: block;\n  width: 20px;\n  height: 2px;\n  background: white;\n  border-radius: 2px;\n}\n\n.bars::before,\n.bars::after {\n  content: \"\";\n  position: relative;\n}\n\n.bars::before {\n  top: -6px;\n}\n\n.bars::after {\n  top: 4px;\n}\n\n/* --- layout + drawer --- */\n\n.layout {\n  display: grid;\n  grid-template-columns: 300px minmax(0, 1fr);\n  gap: 1.5rem;\n  /* Vertical padding is tighter than horizontal on purpose: the usable height is\n     100dvh - topbar - this, and the settings column has to fit inside it or the page grows a\n     scrollbar just to show the last panel. */\n  /* the gutters grow with the window (clamped), so a wide monitor gets real margins rather than the\n     same 1.5rem it gets on a laptop */\n  padding: 1rem clamp(1.5rem, 4vw, 4rem);\n  align-items: start;\n}\n\n.layout.nav-closed {\n  grid-template-columns: minmax(0, 1fr);\n  gap: 0;\n}\n\n.layout.nav-closed .sidebar {\n  display: none;\n}\n\n.sidebar {\n  display: grid;\n  gap: 1rem;\n  /* START, not the default `normal` (which acts as stretch). As a phone drawer this becomes\n     `position: fixed; top: 3rem; bottom: 0` -- a grid with a DEFINITE height -- so all the leftover\n     space was handed to the auto rows and every panel grew to fill it. Measured at 390x800: the\n     COLLAPSED `Progress` group was 145px tall against a natural 48, which is why folding it away\n     saved nothing, and an open one carried ~90px of dead air under the dial. The desktop column is\n     `sticky` with an auto height, so it never showed the bug. */\n  align-content: start;\n  position: sticky;\n  top: 1rem;\n  max-height: calc(100dvh - var(--topbar-h) - 2rem);\n  overflow-y: auto;\n  overscroll-behavior: contain;\n  scrollbar-gutter: stable;\n  scrollbar-width: thin;\n  /* room at the end so a panel's shadow is not sliced off flush against the scroll edge, which is\n     what made a scrollable sidebar look broken rather than scrollable */\n  padding-bottom: 0.75rem;\n}\n\n/* The reading column. 74rem (1184px) was wider than most windows, so on a 1100-1300px monitor the\n   quiz ran edge to edge with no margin at all -- it read as a phone layout stretched, not as a page.\n   62rem still gives the choice grid its three 16rem columns; what it adds is the whitespace either\n   side that says where the content stops. Centred in whatever track it is in, so it stays centred\n   with the drawer open as well as closed. */\n.main {\n  max-width: 62rem;\n  width: 100%;\n  margin-inline: auto;\n}\n\n/* Pico gives `section` a `margin-bottom`, which lands on top of the sidebar grid's own `gap` and\n   showed as double-width bands of page background between the panels. The grid owns the spacing. */\n.sidebar > section,\n.main > section {\n  margin: 0;\n}\n\n/* Surface recipe taken from Bulma's `.box`, which reads better than either alternative here: a\n   0.75rem radius, one wide low-opacity shadow, and a 2%-alpha ring INSTEAD of a border. Pico's own\n   card is 0.25rem radius with a heavier layered shadow, and this adapter was also drawing a hard\n   1px `--pico-muted-border-color` edge on top of it -- three things all saying \"box\", which is what\n   made the side panels look flatter and squarer than the Bulma variant.\n\n   Stated outright rather than through `--pico-card-*`: the point is a surface that does NOT vary\n   with the base stylesheet, since the panels are ours in all three. Tokens are declared with the\n   rest at the top of the file. */\n.panel,\n.card {\n  background: var(--pico-card-background-color, #fff);\n  border: 0;\n  border-radius: var(--panel-radius);\n  padding: 1rem;\n  box-shadow: var(--elev-2);\n}\n\n.panel {\n  /* a faint tint, or a white panel on Pico's near-white page has no edge at all */\n  background: light-dark(color-mix(in srgb, var(--primary) 4%, white), color-mix(in srgb, var(--face) 80%, black));\n}\n\n/* Pico styles every button as its primary; these three carry meaning here and were all blue. */\nbutton.warning {\n  background: #d29922;\n  border-color: #d29922;\n  /* dark ink in BOTH palettes: the face is amber either way, so this does not follow the theme */\n  color: #12211a;\n}\n\nbutton.danger {\n  background: #cf222e;\n  border-color: #cf222e;\n  color: white;\n}\n\nbutton.light {\n  background: light-dark(#eef5f2, #223029);\n  border-color: light-dark(rgb(20 86 74 / 20%), rgb(230 239 233 / 20%));\n  color: light-dark(#12211a, #e6efe9);\n}\n\n.card {\n  border-top: 4px solid var(--card-accent);\n}\n\n.controls {\n  display: grid;\n  gap: 0.5rem;\n}\n\n.controls label,\n.controls input,\n.controls select,\n.controls button {\n  margin: 0;\n}\n\n.score-line {\n  margin: 0.3rem 0;\n}\n\n.hint {\n  margin: 0;\n  font-size: 0.85rem;\n}\n\n@media (max-width: 900px) {\n  .layout {\n    grid-template-columns: minmax(0, 1fr);\n  }\n\n  .sidebar {\n    position: fixed;\n    /* the TOKEN, not a repeat of its value: a coarse pointer makes the bar 3.5rem (Skip's 44px\n       floor), and a hardcoded 3rem put the drawer 8px under it */\n    top: var(--topbar-h);\n    bottom: 0;\n    left: 0;\n    max-height: none;\n    z-index: 30;\n    width: min(20rem, 88vw);\n    padding: 1rem;\n    overflow-y: auto;\n    background: var(--pico-background-color, #fff);\n    box-shadow: var(--elev-4);\n  }\n}\n\n/* --- the four panel widgets: dial, points meter, timer, toasts --- */\n\n.dial {\n  display: block;\n  width: 100%;\n  max-width: 190px;\n  margin: 0 auto 0.4rem;\n}\n\n.dial-track,\n.dial-value {\n  fill: none;\n  stroke-width: 16;\n  stroke-linecap: round;\n}\n\n.dial-track {\n  stroke: var(--meter-empty);\n}\n\n.dial-value {\n  stroke-dasharray: 282.74;\n  stroke: #999;\n  transition: stroke-dashoffset 180ms ease-out;\n}\n\n.dial-value.poor {\n  stroke: #ff0000;\n}\n\n.dial-value.weak {\n  stroke: #ff6600;\n}\n\n.dial-value.fair {\n  stroke: #ffcc00;\n}\n\n.dial-value.ok {\n  stroke: #99cc00;\n}\n\n.dial-value.good {\n  stroke: #00cc00;\n}\n\n.dial-text {\n  text-anchor: middle;\n  font-size: 1.5rem;\n  font-weight: 700;\n  fill: currentcolor;\n}\n\n.meter {\n  position: relative;\n  height: 0.9rem;\n  border-radius: 0.5rem;\n  overflow: hidden;\n}\n\n.points-meter {\n  background: linear-gradient(to right, #ff6600, #99cc00, #00cc00);\n}\n\n.meter-mask {\n  position: absolute;\n  top: 0;\n  right: 0;\n  bottom: 0;\n  width: 100%;\n  background: var(--meter-empty);\n  transition: width 120ms linear;\n}\n\n.meter-tick {\n  position: absolute;\n  bottom: 0;\n  height: 45%;\n  width: 2px;\n  background: rgb(18 33 26 / 45%);\n}\n\n.meter-tick.earned {\n  opacity: 0.25;\n}\n\n.timer {\n  margin: 1.2rem 0;\n  height: 2rem;\n  background: var(--meter-empty);\n  border-radius: 4px;\n  overflow: hidden;\n}\n\n.timer-fill {\n  height: 100%;\n  width: 100%;\n  background: #00cc00;\n  transition: width 100ms linear;\n}\n\n.timer-fill.spent {\n  background: #444;\n}\n\n.timer-fill.low {\n  background: #ff6600;\n}\n\n.timer-fill.mid {\n  background: #ffcc00;\n}\n\n.timer-fill.high {\n  background: #00cc00;\n}\n\n.toasts {\n  position: fixed;\n  right: 1.2rem;\n  bottom: 1.2rem;\n  display: grid;\n  gap: 0.5rem;\n  justify-items: end;\n  pointer-events: none;\n  z-index: 10;\n}\n\n.toast {\n  /* the game's voice, not the reading face -- see the type note in `:root` */\n  font-family: var(--display-font);\n  box-shadow: var(--elev-3);\n  padding: 0.8rem 1.4rem;\n  border-radius: var(--pico-border-radius);\n  font-weight: 600;\n  color: white;\n}\n\n.toast.success {\n  background: #2da44e;\n}\n\n.toast.info {\n  background: #0969da;\n}\n\n.toast.warning {\n  background: #bf5b00;\n}\n\n/* --- the question card --- */\n\n.intro {\n  margin: 0 0 0.8rem;\n  font-size: 1.3rem;\n}\n\n.answer {\n  margin: 0 0 1.4rem;\n  padding: 0.6rem 1rem;\n  font-size: 2rem;\n  text-align: center;\n  background: var(--face);\n  border-radius: var(--pico-border-radius);\n}\n\n.candidates {\n  display: grid;\n  grid-template-columns: repeat(auto-fit, minmax(16rem, 1fr));\n  gap: 0.8rem;\n  /* recessed, so the near-white cards have something to be raised out of (see `app.css`) */\n  padding: 0.8rem;\n  border-radius: 14px;\n  background: var(--well);\n  box-shadow: var(--elev-inset);\n}\n\n/* Pico's button sets `--pico-color: var(--pico-primary-inverse)` (white, for a filled primary\n   button), so inheriting it on a pale card face made the text invisible. The card face is the point\n   here -- these are cards, not primary actions -- so the ink is stated outright. */\n.candidate {\n  /* rung 1: the thing you press rests ON the well, it is not painted into it */\n  box-shadow: var(--elev-1);\n  display: flex;\n  align-items: center;\n  justify-content: center;\n  gap: 0.5rem;\n  min-height: 3.4rem;\n  width: auto;\n  margin: 0;\n  font-size: 2rem;\n  background: var(--face);\n  /* the ink follows the face, which is a `light-dark()` pair -- Pico's own `--pico-color` is not\n     used here because the card is our surface, not one of its components */\n  color: light-dark(#12211a, #e6efe9);\n  /* 3.17:1 on the face: the boundary WCAG 1.4.11 asks for, and the only\n     separation that survives a bad monitor */\n  border-color: var(--card-edge);\n}\n\n.accel {\n  flex: none;\n  font-size: 0.8rem;\n  line-height: 1;\n  color: light-dark(#14564a, #a9d8bf);\n  background: light-dark(rgb(20 86 74 / 10%), rgb(230 239 233 / 12%));\n}\n\n.candidate.revealed {\n  display: flex;\n  align-items: center;\n  padding: 0.4rem 1.1rem;\n  border: 1px solid var(--meter-empty);\n  border-radius: var(--pico-border-radius);\n  opacity: 0.55;\n}\n\n.candidate.revealed.correct {\n  opacity: 1;\n  border-color: var(--suit-club);\n}\n\n.candidate.revealed.wrong {\n  opacity: 1;\n  border-color: var(--suit-heart);\n}\n\n.candidate.revealed .mark {\n  flex: none;\n  width: 1.2em;\n  font-size: 1.4rem;\n  font-weight: 700;\n}\n\n.candidate.revealed.correct .mark {\n  color: var(--suit-club);\n}\n\n.candidate.revealed.wrong .mark {\n  color: var(--suit-heart);\n}\n\n.reveal-actions {\n  display: flex;\n  align-items: center;\n  gap: 0.7rem;\n  margin-top: 1rem;\n}\n\n.reveal-actions button {\n  width: auto;\n  margin: 0;\n}\n\n.reveal-hint {\n  font-size: 0.85rem;\n  opacity: 0.7;\n}\n\n/* --- completion + notes --- */\n\n.celebrate {\n  margin: 0.2rem 0;\n  font-size: 3rem;\n  text-align: center;\n}\n\n.celebrate-text {\n  font-size: 1.6rem;\n  text-align: center;\n}\n\n#quiz img {\n  display: block;\n  margin: 1rem auto;\n  max-width: 100%;\n  border-radius: var(--pico-border-radius);\n}\n\n/* Pico 2 styles the disclosure *marker* and the summary type, but gives `<details>` no surface of\n   its own -- so on Pico's own page background the two panels under the question were a heading and a\n   triangle floating on nothing, indistinguishable from the page. The hand-rolled sheet makes them\n   white cards; matched here with Pico's own card tokens so it follows its light/dark theme. */\n.main > .notes {\n  margin-top: 1rem;\n  padding: 0.6rem 1rem;\n  border: 1px solid var(--pico-muted-border-color, rgb(20 86 74 / 12%));\n  border-radius: var(--pico-border-radius);\n  background: var(--pico-card-background-color, #fff);\n  /* NOT `--pico-card-box-shadow`: Pico's is six layers, offset to the RIGHT and tinted\n     blue-grey, so the notes were the one thing on the page lit from a different direction. */\n  box-shadow: var(--elev-1);\n}\n\n/* Same problem one level down: the sidebar's disclosures sit on a tinted panel in the same ink as\n   the body text around them, so they did not read as controls.\n\n   Set through Pico's OWN token rather than a `color` rule: Pico styles the closed state with\n   `details summary:not([role])`, specificity (0,1,2), which out-specifies `.filter-help > summary`\n   (0,1,1) -- a colour declared there is simply ignored, which is what the first attempt did. Either\n   match its specificity or hand it the variable it is already reading. The variable is the honest\n   one: it keeps Pico's own hover / focus / open transitions working off the same value. */\n.filter-help,\n.advanced,\n.appearance,\n.main > .notes {\n  --pico-accordion-close-summary-color: light-dark(#14564a, #7fc8a4);\n}\n\n.main > .notes > summary {\n  font-weight: 600;\n}\n\n.notes iframe {\n  width: 100%;\n  height: 40vh;\n  border: 0;\n}\n\n/* Pico claims `aria-busy=\"true\"` as its LOADING COMPONENT: `white-space: nowrap` on the element plus\n   a spinner `::before`. The choice group carries that attribute while an answer is in flight (see\n   quiz.html.j2), and on a grid of wrapped multi-line choices Pico's version was a mess -- every\n   candidate's text snapped to one line and spilled out of its box (buttons measured 122px tall\n   before the answer, 74px with the text overflowing during it), for the whole 2.5-3.5s the toast\n   sequence takes. The attribute is correct ARIA and stays; Pico's interpretation of it does not.\n   General lesson: in a classless stylesheet, ARIA state attributes are also style hooks. */\n.candidates[aria-busy=\"true\"] {\n  white-space: normal;\n}\n\n.candidates[aria-busy=\"true\"]::before {\n  display: none;\n}\n\n.filter-status {\n  font-size: 0.8rem;\n  line-height: 1.35;\n}\n\n/* Pico's `dialog` IS the overlay: fixed, full-viewport, flex-centred, translucent, with a backdrop\n   filter -- and it expects `dialog > article` to be the card. This app has a native `<dialog>`\n   toggled by `data-attr:open` and no article, so under Pico the topics picker rendered as a\n   full-screen wash with bare unstyled content floating in the middle of it.\n\n   Adding an `<article>` would hand Pico the card for free, and it is tempting. Not done, because\n   Pico's overlay covers the viewport and swallows clicks: the picker would be modal under one\n   stylesheet and not the others, and the A/B is only worth anything if the app behaves the same in\n   all three. So the card geometry is stated here, matching `app.css`. `[open]` is kept in the\n   selector so Pico's own `dialog:not([open]) { display: none }` still wins when it is closed. */\n.topics-dialog[open] {\n  display: flex;\n  flex-direction: column;\n  /* stretch, EXPLICITLY: Pico's own `dialog` rule is a centring flex overlay (`align-items: center`),\n     which this rule only half-overrides -- the children then shrink-to-fit and the topic list came\n     out 208px wide inside an 896px card, so its columns never appeared. */\n  align-items: stretch;\n  position: fixed;\n  inset: 5vh auto auto 50%;\n  transform: translateX(-50%);\n  min-width: 0;\n  height: auto;\n  min-height: 0;\n  /* Wide enough for the topic list to flow into columns -- see `.topic-list`. */\n  /* WIDTH, not just max-width. The card is fixed-positioned, so it shrink-to-fits its content --\n     and a grid of `minmax(13rem, 1fr)` tracks is happy at one column, so the picker stayed narrow\n     and the columns never appeared. Stating the width is what lets the list use them. */\n  width: min(56rem, 92vw);\n  max-width: 92vw;\n  max-height: 90dvh;\n  /* the card itself never scrolls; `.topics-scroll` inside it does */\n  overflow: hidden;\n  /* ABOVE the drawer (which is z-index 30 as a mobile overlay). The Topics button lives IN the\n     drawer, so on a phone the picker opened behind the thing you opened it from and looked like a\n     no-op. Desktop hid the bug: there the sidebar is a column and never overlaps the dialog. */\n  z-index: 50;\n  padding: 1.25rem 1.5rem;\n  border-radius: var(--pico-border-radius);\n  background: var(--pico-card-background-color, #fff);\n  backdrop-filter: none;\n  box-shadow: var(--elev-4);\n}\n\n.topics-dialog h2 {\n  margin-top: 0;\n}\n\n.topics-dialog p,\n.topics-dialog li {\n  font-size: 0.9rem;\n}\n\n/* The card is a COLUMN: a scroller in the middle, the buttons pinned outside it. The whole dialog\n   used to scroll, so nineteen topics pushed Apply / Clear / Close half off the bottom edge. */\n.topics-scroll {\n  overflow-y: auto;\n  /* a flex item will not shrink below its content without this, so the scroller would grow the card\n     instead of scrolling inside it */\n  min-height: 0;\n  margin-bottom: 0.2rem;\n}\n\n/* As many columns as the card is wide enough for. Nineteen topics stacked in one column is ~880px\n   of list, which scrolls on any laptop; at three columns they are all visible at once, which is the\n   point of a picker you scan rather than read. One column on a phone, where 13rem does not fit twice. */\n.topic-list {\n  display: grid;\n  grid-template-columns: repeat(auto-fit, minmax(13rem, 1fr));\n  gap: 0.35rem 1.25rem;\n  margin-bottom: 0.6rem;\n}\n\n.dialog-actions {\n  display: flex;\n  gap: 0.5rem;\n  margin: 0.8rem 0;\n}\n\n.dialog-actions button {\n  width: auto;\n  margin: 0;\n}\n\n@media (prefers-reduced-motion: reduce) {\n  *,\n  *::before,\n  *::after {\n    animation-duration: 0.001ms !important;\n    transition-duration: 0.001ms !important;\n  }\n}\n\n/* the collapsed presentation group in the settings panel */\n.appearance summary {\n  cursor: pointer;\n  font-size: 0.9rem;\n}\n\n.appearance[open] {\n  display: grid;\n  gap: 0.5rem;\n}\n\n/* --- dark palette: our tokens layered over Pico's own dark theme ---\n   Same reasoning as app.css: the spade stops being black, and the other three lighten until each\n   clears 4.5:1 on the dark card face. */\n/* --- the completion screen's figures (see templates/completed.html.j2) ---\n   Layout only. The assembling animation lives in `juice.css`, so with the game-feel toggle off this\n   is a legible score summary rather than a broken one -- which is why the two are split. */\n.finale-figures {\n  display: flex;\n  flex-wrap: wrap;\n  justify-content: center;\n  gap: 1.6rem;\n  margin: 1rem 0 1.4rem;\n}\n\n.finale-stat {\n  display: flex;\n  flex-direction: column;\n  align-items: center;\n  gap: 0.15rem;\n}\n\n.figure {\n  /* the game's voice, not the reading face -- see the type note in `:root` */\n  font-family: var(--display-font);\n  font-size: 2.4rem;\n  font-weight: 800;\n  font-variant-numeric: tabular-nums;\n  line-height: 1;\n  color: var(--card-accent);\n}\n\n.figure.big {\n  font-size: 3.4rem;\n}\n\n.figure-unit {\n  /* the game's voice, not the reading face -- see the type note in `:root` */\n  font-family: var(--display-font);\n  font-size: 1.6rem;\n  font-weight: 700;\n  color: var(--card-accent);\n}\n\n.finale-label {\n  font-size: 0.85rem;\n  opacity: 0.75;\n}\n\n/* COLOUR emoji, asked for by name. `--suit-symbols` puts \"Segoe UI Symbol\" in every stack ahead of\n   the generic so the SUIT glyphs land in a chosen face rather than a last-resort one -- and that same\n   font also has the party popper, in monochrome, so the finale's poppers and confetti turned into\n   black line art. The two wants are opposite: the suits want a text face (they are coloured by CSS,\n   see `font-variant-emoji: text` above), the party wants the colour emoji font. So the party names\n   it. `font-variant-emoji: emoji` asks for the colour presentation as well as the face; browsers\n   that do not know the property ignore it and the font choice still does the work. */\n.pop,\n.confetti-bit {\n  font-family: \"Segoe UI Emoji\", \"Apple Color Emoji\", \"Noto Color Emoji\", sans-serif;\n  font-variant-emoji: emoji;\n}\n\n/* inline-block so each character can be transformed on its own */\n.digit,\n.pop {\n  display: inline-block;\n}\n\n/* --- the debug panel (dev only; see `app.DEBUG_MODE`) ---\n   Deliberately plain and a bit ugly: scaffolding should look like scaffolding, so nobody mistakes it\n   for part of the quiz or leaves it armed on a deployment. */\n.panel.debug {\n  background: light-dark(#fff6e0, #2a2312);\n  box-shadow: inset 0 0 0 2px light-dark(#d29922, #8a6a1a);\n  display: grid;\n  gap: 0.4rem;\n  font-size: 0.85rem;\n}\n\n.debug-row {\n  display: flex;\n  gap: 0.35rem;\n  flex-wrap: wrap;\n}\n\n.debug-row button {\n  font-size: 0.8rem;\n  padding: 0.2rem 0.45rem;\n  width: auto;\n  margin: 0;\n}\n\n/* --- the HUD (app bar): live state + Skip ---\n   The score used to be in the app bar AND duplicated in a sidebar `#score` panel, while Skip -- an\n   action you take mid-question -- sat in the sidebar beside the controls that restart the quiz. Now\n   everything you need while playing is up here, and the drawer holds only what restarts the quiz. */\n.hud-meter {\n  width: 7rem;\n  height: 0.5rem;\n  flex: none;\n  box-shadow: inset 0 0 0 1px rgb(255 255 255 / 25%);\n}\n\n/* The mask covers the UNEARNED part, so it has to be OPAQUE: the track carries the red-to-green\n   gradient, and anything translucent lets that gradient show through -- which makes the gauge look\n   full at every score. (It was `rgb(255 255 255 / 22%)` for one commit, chosen to stop an opaque\n   pale-green block reading as a stray rectangle on the green bar, and that is exactly what it broke.)\n   The app bar's own dark green is the answer: opaque, so the gradient is hidden, and it reads as an\n   unfilled groove in the bar rather than a foreign colour sitting on top of it. */\n.hud-meter .meter-mask {\n  background: var(--primary-dark);\n}\n\n.hud-meter .meter-tick {\n  background: rgb(255 255 255 / 55%);\n}\n\n.hud-meter .meter-tick.earned {\n  opacity: 0.45;\n}\n\n.topbar .skip {\n  flex: none;\n  display: inline-flex;\n  align-items: center;\n  gap: 0.35rem;\n  padding: 0.25rem 0.6rem;\n  font-size: 0.85rem;\n  font-weight: 600;\n  width: auto;\n  margin: 0;\n}\n\n.skip-count {\n  font-variant-numeric: tabular-nums;\n  padding: 0 0.3rem;\n  border-radius: 999px;\n  background: rgb(0 0 0 / 18%);\n}\n\n/* The app bar is the one place where running out of width is likely, so the pieces drop in order of\n   what you can live without: the gauge first (the points number says the same thing less precisely),\n   then the score fraction. Skip and the streak never drop -- one is an action, the other is the\n   reason to keep going. */\n@media (max-width: 760px) {\n  .hud-meter {\n    display: none;\n  }\n}\n\n@media (max-width: 520px) {\n  .topbar h1 {\n    font-size: 1rem;\n    overflow: hidden;\n    text-overflow: ellipsis;\n    white-space: nowrap;\n  }\n\n  .topbar-score {\n    font-size: 0.8rem;\n  }\n}\n\n/* the dial's new home: a folded group, because it spends a lot of space on one number */\n.panel.progress > summary {\n  cursor: pointer;\n  font-weight: 600;\n  font-size: 0.9rem;\n}\n\n.panel.progress[open] {\n  display: grid;\n  gap: 0.4rem;\n}\n\n.panel.progress .dial {\n  max-width: 130px;\n}\n\n/* --- overflow insurance ---------------------------------------------------- *\n * Two places where content can be wider than its box, both of which show up as a horizontal\n * scrollbar on the whole page rather than as a local problem:\n *   - auction text and bml descriptions are joined with invisible separators and can contain long\n *     unbroken tokens (`invite(~10/11)`), so they get an explicit break opportunity;\n *   - the app bar is a nowrap flex row, and a flex item will not shrink below its content unless it\n *     is told it may -- `min-width: 0` plus an ellipsis on the title is what lets the HUD survive a\n *     narrow window instead of pushing the page wider.\n */\n.answer,\n.candidate-text,\n.finale-label {\n  overflow-wrap: anywhere;\n}\n\n.topbar h1 {\n  min-width: 0;\n  overflow: hidden;\n  text-overflow: ellipsis;\n  white-space: nowrap;\n}\n\n.topbar-score,\n.topbar .skip,\n.streak {\n  min-width: 0;\n}\n\n/* --- touch and small screens ------------------------------------------------ *\n * Measured on an emulated 390x844 phone: the hamburger was a 33x15px target and Skip 70x27, both well\n * under the ~44px minimum a finger needs. And at 2rem an auction wraps to three lines, so each choice\n * became a 103px-tall card and the page ran to 1207px of scroll -- the type scale is what to fix, not\n * the layout, which had no horizontal overflow at any width. */\n.nav-toggle {\n  display: inline-flex;\n  align-items: center;\n  justify-content: center;\n  min-width: 44px;\n  min-height: 44px;\n}\n\n/* A coarse pointer gets the bigger targets; a mouse does not need them, and a 44px-tall Skip would\n   make the app bar taller for everyone. */\n.topbar .skip {\n  /* a floor even with a mouse: 27px was the measured height, which is a small target for the one\n     action you take mid-question */\n  min-height: 32px;\n}\n\n@media (pointer: coarse) {\n  .topbar .skip {\n    min-height: 44px;\n    padding-inline: 0.8rem;\n  }\n}\n\n@media (max-width: 560px) {\n  .answer {\n    font-size: 1.4rem;\n    padding: 0.45rem 0.6rem;\n    /* every rem of dead space between the prompt and the choices is a choice pushed under the\n       fold -- the phone complaint is that five answers do not fit at once */\n    margin-bottom: 0.9rem;\n  }\n\n  .candidate,\n  .candidate.button {\n    font-size: 1.3rem;\n    min-height: 2.9rem;\n  }\n\n  .intro {\n    font-size: 1.05rem;\n    margin-bottom: 0.5rem;\n  }\n\n  /* a phone has no room for a 16rem minimum column: one choice per row, full width */\n  .candidates {\n    grid-template-columns: minmax(0, 1fr);\n    padding: 0.5rem;\n    /* one column, so the gap only ever costs height: 0.8rem x 4 was a sixth of a card */\n    gap: 0.5rem;\n  }\n\n  .card {\n    padding: 0.7rem;\n  }\n\n  .notes iframe {\n    height: 55vh;\n  }\n}\n\n/* --- the app bar on a phone ------------------------------------------------- *\n * Three fixes, all measured at 390x844 (iPhone 12) and 360x740 (Galaxy S9):\n *   - the score no longer wraps (see `.topbar-score` above), which is what made the bar 78px tall\n *     and its contents read vertically;\n *   - the gaps and the theme toggle tighten, so the title keeps some width before the ellipsis;\n *   - below 400px the correct/attempted FRACTION drops. That is the next rung of the same\n *     shedding ladder as the gauge at 760px: points survive because they are what the skips are\n *     earned against, and the fraction is still on the drawer's dial. */\n@media (max-width: 520px) {\n  .topbar {\n    gap: 0.5rem;\n    padding-inline: 0.6rem;\n  }\n\n  .theme-toggle {\n    padding: 0.3rem;\n  }\n}\n\n/* 400px, so BOTH common phone widths are on the same side of it: 390 (iPhone 12/13/14) and 360\n   (Galaxy S9 and most of android). Measured with the fraction in, the title had 86-116px left --\n   \"U16 Squad S...\" -- and the bar read as five things fighting; without it the title gets ~118px\n   at both widths and the live number is still there. Nothing is lost: the fraction is on the\n   drawer's dial, and the aria-labels in the bar never dropped it. */\n@media (max-width: 400px) {\n  .score-fraction {\n    display: none;\n  }\n}\n\n/* THE COUNTDOWN GOES ABOVE THE QUESTION AND STICKS TO THE BAR (phone/tablet widths only).\n * It used to sit below the card in flow, which on a phone put it in the worst possible place: with\n * five choices it is already at the fold, and the browser's own URL bar -- which slides back in the\n * moment you scroll up -- covers whatever is at the bottom of the viewport. So the one element that\n * is worthless off-screen was the one most likely to be off-screen.\n * `order: -1` moves it visually only; the DOM (and so the screen-reader order, and every template)\n * is untouched. It is also slimmer here: it is a bar, not a panel, and the height it gives back is\n * most of an answer card. */\n@media (max-width: 900px) {\n  .main {\n    display: flex;\n    flex-direction: column;\n  }\n\n  .timer {\n    order: -1;\n    position: sticky;\n    top: var(--topbar-h);\n    z-index: 12;\n    height: 1.4rem;\n    margin: 0 0 0.8rem;\n  }\n}\n\n/* THE THEME SWITCH. Both palettes live in `light-dark()` pairs on the tokens above, not in a\n   `@media (prefers-color-scheme: dark)` block -- which is what makes an always-available toggle\n   possible at all. A media query answers to the OS and to nothing else, so a palette written that\n   way can only be overridden by writing it a second time; `light-dark()` resolves against the\n   element's COMPUTED `color-scheme`, so forcing one is a single declaration. It also moves the\n   browser's own surfaces -- canvas, scrollbars, form controls -- which a class on <body> would not.\n\n   `$_theme` is mirrored onto <html> as `data-theme`, and is absent when it is `auto` (the default),\n   where `color-scheme: light dark` hands the choice back to the OS. On the ROOT, because that is the\n   only element the canvas and the scrollbars read their scheme from -- the black-rim lesson again,\n   see the `html` rule above. Pico and Bulma document the same attribute in the same place, so their\n   own dark themes follow this toggle without being told about it. */\n:root[data-theme=\"dark\"] {\n  color-scheme: only dark;\n}\n\n:root[data-theme=\"light\"] {\n  color-scheme: only light;\n}\n\n/* The section an AMBIGUOUS auction comes from (\"Opponents open Strong 1C\"), under the auction: the\n   same calls mean different things in different parts of the notes, and without it the player has\n   to guess which part the question is from. */\n.quiz-context {\n  display: block;\n  margin-top: 0.2rem;\n  font-size: 0.9rem;\n  font-weight: normal;\n  opacity: 0.75;\n}\n", "app.css": "/* Hand-written: this is the cost side of the experiment. Panel supplied a MaterialTemplate,\n   a Dial, a LinearGauge and toast notifications; here they are a grid, two meters and a\n   div. Kept deliberately plain -- no framework, no build step. */\n\n:root {\n  /* One hue family, so the app bar, the sidebar and the quiz card read as one surface instead of\n     panel's default green-card-on-lightblue clash. Elevation is a soft shadow rather than the\n     hard 10px offset the panel styling used. */\n  --primary: light-dark(#14564a, #123f36);\n  --primary-dark: light-dark(#0e3f37, #0b2b25);\n  /* Content surfaces are NEUTRAL on purpose. The four suit colours are fixed by the domain, so\n     every surface behind them has to stay out of their way -- the old seagreen quiz card was the\n     only surface that made them hard to read. Green now lives on the chrome (app bar, accents). */\n  --card: light-dark(#ffffff, #18231f);\n  --card-accent: light-dark(#2e8b57, #3fae6d); /* the quiz's green, as a rule rather than a fill */\n  --side: light-dark(#eef4f1, #0b1210);\n  --face: light-dark(#fdfcf7, #1d2724); /* card face, where the suit colours have to read */\n  /* The hover lift is a TOKEN, not a literal. It was `#fff`, which is a lift in the light palette\n     and a floodlight in the dark one: the card went white under light ink, so the choice you were\n     pointing at was the one you could not read. Like the face, this is pinned by the suits -- the\n     lift is mostly the shadow, and the fill only has to move enough to be felt. */\n  --face-hover: light-dark(#ffffff, #222d29);\n  /* THE SURFACE LADDER. The answer cards used to be 1.03:1 against the quiz card they sat on --\n     three surfaces inside the top 8% of the luminance range, so they read as flat. And no better\n     card colour exists: `--face` is pinned by the four suit colours (all >=4.9:1 against it, see\n     tests/test_suit_colours.py), and contrast up here is so gamma-compressed that a fill has to go\n     to ~#dde7e2 before it even reaches 1.23:1 -- by then it is not white paper any more.\n     So separation comes from the surround instead: page -> card -> WELL (recessed) -> face, each\n     step ~1.1-1.24:1, plus a real BOUNDARY on the cards themselves. `--card-edge` is 3.17:1 on the\n     face, which is what WCAG 1.4.11 asks of a non-text UI boundary and, unlike a fill difference,\n     survives a cheap monitor and sunlight. Pinned by tests/test_surfaces.py. */\n  --well: light-dark(#e0e9e4, #0e1613);\n  --card-edge: light-dark(#7f938b, #6b7d76);\n  --meter-empty: light-dark(#e3eeea, #26332e); /* the un-earned part of a meter; opaque, it masks the track gradient */\n  --ink: light-dark(#12211a, #e6efe9);\n  /* 'Open Sans' is what bml.css sets for the system notes, so the quiz matches the notes\n     wherever it is installed; Segoe UI is the Windows fallback. Switchable at runtime -- see\n     the [data-font] rules below. */\n  --ui-font: \"Open Sans\", \"Segoe UI\", system-ui, -apple-system, Roboto, var(--suit-symbols), sans-serif;\n  --display-font: \"Nunito\", \"Trebuchet MS\", \"Segoe UI\", system-ui, var(--suit-symbols), sans-serif;\n  /* darkened from bml.css's MediumSeaGreen / Orange / Red / Black -- see the suit rules below */\n  --suit-club: light-dark(#1e7a45, #4bbd7a);\n  --suit-diamond: light-dark(#b35300, #ff9d3d);\n  --suit-heart: light-dark(#cc0000, #ff6b6b);\n  --suit-spade: light-dark(#000000, #e8eff0);\n  /* `light dark` is truthful now that a dark palette exists at the bottom of this file. It was\n     `light` for a while precisely because claiming dark support without shipping it makes the browser\n     paint its own surfaces dark -- the canvas beyond the document, which reads as a black rim, and\n     the scrollbars -- while the content stays light. */\n  /* the app bar's height, so the sidebar's own scroll region -- and the sticky countdown on a\n     phone -- can be sized off it rather than off a guess; being 13px out was enough to put a\n     scrollbar back on the page.\n     3.875rem = 62px = the hamburger's 44px touch target plus the bar's 0.55rem of padding, which\n     is what the bar has ACTUALLY measured since the touch targets went in. It said 3rem for\n     months, so the drawer opened 14px under the bar and anything sticking to `--topbar-h` would\n     have hidden behind it. A coarse pointer lands on the same number (Skip and the theme toggle\n     grow to the same 44px floor), so one value is right for both. */\n  --topbar-h: 3.875rem;\n  /* ELEVATION -- one light, overhead. Every rung is `x = 0`, `blur = 2x offset`, and each is a\n     DIRECT cast plus a tighter AMBIENT one (contact occlusion, half the offset). Depth only reads as\n     depth while every shadow on the page agrees about where the light is; before this the app had\n     seven ad-hoc alphas, a drawer lit from nowhere (`0 0 40px`) and Pico's own left-lit, blue-tinted\n     shadow under the notes. Rungs: 1 things resting on a surface (answer cards, disclosures), 2 the\n     panels and the quiz card, 3 what floats over them (toasts, a lifted card), 4 what covers them\n     (dialog, mobile drawer). See DESIGN.md \"Elevation and shadow\".\n     The cast takes the ink's hue rather than pure black: a neutral-black shadow over a tinted page\n     reads as dirt. */\n  /* Both palettes, one declaration each, via `light-dark()` -- see the theming note above. Dark\n     inverts the job: a cast shadow barely registers on a dark ground, so elevation there is carried\n     by LIGHTENING the surface and these mostly hold an edge. The alphas roughly double and rung 1's\n     hairline flips from a dark ring to a light one; the GEOMETRY is identical, so nothing changes\n     rung when the scheme flips. */\n  --elev-inset: inset 0 2px 6px light-dark(rgb(18 33 26 / 10%), rgb(0 0 0 / 35%));\n  --elev-1:\n    0 1px 2px light-dark(rgb(18 33 26 / 10%), rgb(0 0 0 / 30%)),\n    0 0 0 1px light-dark(rgb(18 33 26 / 4%), rgb(230 239 233 / 7%));\n  --elev-2:\n    0 4px 8px light-dark(rgb(18 33 26 / 12%), rgb(0 0 0 / 35%)),\n    0 2px 4px light-dark(rgb(18 33 26 / 8%), rgb(0 0 0 / 25%));\n  --elev-3:\n    0 8px 16px light-dark(rgb(18 33 26 / 16%), rgb(0 0 0 / 45%)),\n    0 4px 8px light-dark(rgb(18 33 26 / 10%), rgb(0 0 0 / 28%));\n  --elev-4:\n    0 16px 32px light-dark(rgb(18 33 26 / 30%), rgb(0 0 0 / 60%)),\n    0 8px 16px light-dark(rgb(18 33 26 / 18%), rgb(0 0 0 / 35%));\n  /* TYPE, in two roles -- DESIGN.md \"Type: three roles, and only one of them may have personality\".\n     `--ui-font` is what you READ: the prompt, the five answers, every control. It is what the\n     Appearance picker changes, because a reading face is a legitimate preference.\n     `--display-font` is the game's VOICE: app bar, HUD numbers, toasts, the finale. Personality is\n     nearly free on three words seen a hundred times and expensive on a sentence read against a\n     clock, so it lives here and nowhere else. Rounded terminals are the cheapest \"this is a game,\n     not a form\" signal there is, and cost no legibility on a humanist face.\n     `--suit-symbols` sits in EVERY stack, before the generic: the suits are text glyphs, and a face\n     without them falls back silently -- so a spade could arrive in a different font from the bid\n     beside it. Naming the symbol fonts makes that fallback deterministic instead of last-resort.\n     Nothing may follow a generic family in a stack; a generic always matches. */\n  --suit-symbols: \"Segoe UI Symbol\", \"Noto Sans Symbols2\", \"DejaVu Sans\";\n  color-scheme: light dark;\n  scrollbar-color: light-dark(rgb(20 86 74 / 35%), rgb(230 239 233 / 30%)) transparent;\n}\n\n/* The font experiment: `$_font` is a local signal bound to the sidebar picker and mirrored onto\n   the body as a data attribute, so trying a face costs no round trip and no reload. */\nbody[data-font=\"system\"] {\n  --ui-font: system-ui, -apple-system, \"Segoe UI\", Roboto, var(--suit-symbols), sans-serif;\n}\n\nbody[data-font=\"serif\"] {\n  --ui-font: \"Iowan Old Style\", \"Palatino Linotype\", Georgia, \"Times New Roman\", var(--suit-symbols), serif;\n}\n\nbody[data-font=\"mono\"] {\n  --ui-font: \"Cascadia Code\", \"JetBrains Mono\", Consolas, \"Courier New\", var(--suit-symbols), monospace;\n}\n\nbody[data-font=\"rounded\"] {\n  --ui-font: \"Nunito\", \"Trebuchet MS\", \"Segoe UI\", system-ui, var(--suit-symbols), sans-serif;\n}\n\n* {\n  box-sizing: border-box;\n}\n\n/* THE CANVAS, stated rather than inherited. A background on `body` alone does reach the canvas --\n   the UA propagates it -- but only once the sheet has loaded and only over the area the document\n   covers. What is left over (a document shorter than the viewport, the strip a browser exposes after\n   a window resize, the scrollbars) is painted from the ROOT element's own background, and with\n   nothing there the UA picks one from `color-scheme` -- black on a dark-OS machine, under a page\n   rendering light. That is the black rim. Saying it here also gives the browser a base background\n   colour before first paint, which is what it fills a resized window with. */\nhtml {\n  min-height: 100%;\n  background: light-dark(#f4f6f5, #0f1512);\n}\n\nbody {\n  margin: 0;\n  font-family: var(--ui-font);\n  color: var(--ink);\n  background: light-dark(#f4f6f5, #0f1512);\n}\n\n/* --- suit colours: bml's class NAMES (.ccolor/.dcolor/.hcolor/.scolor, as bml2html emits),\n   with DARKENED values. bml.css uses MediumSeaGreen / Orange / Red / Black, which are right for\n   its antiquewhite page but measure ~2.7:1 and ~2.0:1 against a near-white card face -- both fail\n   even the 3:1 large-text AA threshold, and the filter status line renders them at small sizes.\n   These are the same hues taken darker, all >=4:1 on --face (pinned by tests/test_suit_colours.py).\n\n   `font-variant-emoji: text` keeps hearts and diamonds as text glyphs even where a font would\n   rather draw them as colour emoji -- an emoji glyph ignores `color`. --- */\n\n.ccolor,\n.dcolor,\n.hcolor,\n.scolor {\n  /* No font-family override: the glyphs inherit the chosen face, and the browser's own fallback\n     covers a face that lacks them. Only the emoji presentation has to be forced off. */\n  font-variant-emoji: text;\n}\n\n.ccolor {\n  color: var(--suit-club);\n}\n\n.dcolor {\n  color: var(--suit-diamond);\n}\n\n.hcolor {\n  color: var(--suit-heart);\n}\n\n.scolor {\n  color: var(--suit-spade);\n}\n\n.topbar {\n  position: sticky;\n  top: 0;\n  min-height: var(--topbar-h);\n  z-index: 15;\n  display: flex;\n  align-items: center;\n  gap: 0.9rem;\n  background: linear-gradient(180deg, var(--primary), var(--primary-dark));\n  color: white;\n  padding: 0.55rem 1rem;\n  box-shadow: var(--elev-2);\n}\n\n.topbar h1 {\n  /* the game's voice, not the reading face -- see the type note in `:root` */\n  font-family: var(--display-font);\n  margin: 0;\n  font-size: 1.25rem;\n  font-weight: 600;\n  letter-spacing: 0.01em;\n}\n\n.topbar-spacer {\n  flex: 1;\n}\n\n.topbar-score {\n  /* the game's voice, not the reading face -- see the type note in `:root` */\n  font-family: var(--display-font);\n  font-variant-numeric: tabular-nums;\n  font-size: 0.95rem;\n  opacity: 0.9;\n  /* NOWRAP, and it does not shrink. On a 390px phone this was the widest thing the bar could not\n     fit, so it wrapped to three lines -- \"0/0\", \"· 0\", \"pts\", read vertically -- and took the bar\n     from 48px to 78px. A score is one line or it is not a score; the title is the flex item that\n     gives way (it has `min-width: 0` and an ellipsis), and below 400px the fraction drops out\n     entirely rather than the bar overflowing. */\n  white-space: nowrap;\n  flex: none;\n}\n\n/* the hamburger: three bars drawn with a box shadow, no icon font */\n.nav-toggle {\n  background: transparent;\n  /* a base sheet can put `margin-bottom` on every button (Pico does, 16px), and on a flex item that\n     is 16px of the APP BAR's height -- 78px instead of 48 with nobody able to see why. Stated here\n     too so the three variants measure the same. */\n  margin: 0;\n  padding: 0.4rem;\n  border-radius: 8px;\n  line-height: 0;\n}\n\n/* same guard as the answer cards below: a tapped hamburger kept its highlight afterwards */\n@media (hover: hover) {\n  .nav-toggle:hover {\n    background: rgb(255 255 255 / 15%);\n  }\n}\n\n/* The theme toggle: app-bar chrome, so it reads like the hamburger rather than like a form button.\n   Sized to a 32px floor with a mouse and 44px on a coarse pointer, same as Skip -- it sits between\n   the score and Skip, and a 24px target there is a mis-tap on the thing beside it. */\n.theme-toggle {\n  width: auto;\n  margin: 0;\n  min-height: 32px;\n  padding: 0.3rem 0.5rem;\n  border: 0;\n  border-radius: 8px;\n  background: transparent;\n  color: white;\n  font-size: 1.05rem;\n  line-height: 1;\n}\n\n@media (hover: hover) {\n  .theme-toggle:hover {\n    background: rgb(255 255 255 / 15%);\n  }\n}\n\n@media (pointer: coarse) {\n  .theme-toggle {\n    min-height: 44px;\n  }\n}\n\n.bars,\n.bars::before,\n.bars::after {\n  display: block;\n  width: 20px;\n  height: 2px;\n  background: white;\n  border-radius: 2px;\n}\n\n.bars::before,\n.bars::after {\n  content: \"\";\n  position: relative;\n}\n\n.bars::before {\n  top: -6px;\n}\n\n.bars::after {\n  top: 4px;\n}\n\n.layout {\n  display: grid;\n  grid-template-columns: 300px minmax(0, 1fr);\n  gap: 1.5rem;\n  /* Vertical padding is tighter than horizontal on purpose: the usable height is\n     100dvh - topbar - this, and the settings column has to fit inside it or the page grows a\n     scrollbar just to show the last panel. */\n  /* the gutters grow with the window (clamped), so a wide monitor gets real margins rather than the\n     same 1.5rem it gets on a laptop */\n  padding: 1rem clamp(1.5rem, 4vw, 4rem);\n  align-items: start;\n  transition: grid-template-columns 160ms ease;\n}\n\n/* Collapsed: ONE track, not a zero-width first track. Hiding the sidebar takes it out of grid\n   flow, so `main` is auto-placed into the first track -- with `0 minmax(0, 1fr)` that squashed the\n   quiz to nothing instead of widening it. */\n.layout.nav-closed {\n  grid-template-columns: minmax(0, 1fr);\n  gap: 0;\n}\n\n.layout.nav-closed .sidebar {\n  display: none;\n}\n\n/* Item 6: cap the measure. Auctions set at 2rem stretched across a 1900px monitor are harder to\n   scan, not easier -- the eye has to travel. The column centres in whatever space it has. */\n/* The reading column. 74rem (1184px) was wider than most windows, so on a 1100-1300px monitor the\n   quiz ran edge to edge with no margin at all -- it read as a phone layout stretched, not as a page.\n   62rem still gives the choice grid its three 16rem columns; what it adds is the whitespace either\n   side that says where the content stops. Centred in whatever track it is in, so it stays centred\n   with the drawer open as well as closed. */\n.main {\n  max-width: 62rem;\n  width: 100%;\n  margin-inline: auto;\n}\n\n/* The sidebar is settings, and it is the tallest thing on the page -- long enough that the whole\n   document scrolled, taking the question with it. It gets its own scroll region instead: sticky under\n   the app bar and capped to the viewport, so the quiz stays put and the page itself usually needs no\n   scrollbar at all. */\n.sidebar {\n  display: grid;\n  gap: 1.5rem;\n  /* START, not the default `normal` (which acts as stretch). As a phone drawer this becomes\n     `position: fixed; top: 3rem; bottom: 0` -- a grid with a DEFINITE height -- so all the leftover\n     space was handed to the auto rows and every panel grew to fill it. Measured at 390x800: the\n     COLLAPSED `Progress` group was 145px tall against a natural 48, which is why folding it away\n     saved nothing, and an open one carried ~90px of dead air under the dial. The desktop column is\n     `sticky` with an auto height, so it never showed the bug. */\n  align-content: start;\n  position: sticky;\n  top: 1rem;\n  max-height: calc(100dvh - var(--topbar-h) - 2rem);\n  overflow-y: auto;\n  overscroll-behavior: contain;\n  scrollbar-gutter: stable;\n  scrollbar-width: thin;\n  /* room at the end so a panel's shadow is not sliced off flush against the scroll edge, which is\n     what made a scrollable sidebar look broken rather than scrollable */\n  padding-bottom: 0.75rem;\n  padding-right: 0.25rem;\n}\n\n.panel,\n.card {\n  border-radius: 25px;\n  padding: 20px;\n  box-shadow: var(--elev-2);\n}\n\n.panel {\n  background: var(--side);\n}\n\n.card {\n  background: var(--card);\n  color: var(--ink);\n  border-top: 4px solid var(--card-accent);\n}\n\n.panel.controls {\n  display: grid;\n  gap: 0.7rem;\n}\n\n.controls label {\n  display: grid;\n  gap: 0.2rem;\n  font-size: 0.9rem;\n}\n\n.controls label:has(input[type=\"checkbox\"]) {\n  grid-template-columns: auto 1fr;\n  align-items: center;\n  gap: 0.4rem;\n}\n\n.score-line {\n  margin: 0.3rem 0;\n}\n\n/* --- meters (the Dial / LinearGauge replacements) --- */\n\n.meter {\n  position: relative;\n  height: 0.9rem;\n  background: rgb(20 86 74 / 10%);\n  border-radius: 0.8rem;\n  overflow: hidden;\n  margin-bottom: 0.6rem;\n}\n\n/* The gradient spans the whole track, so a given colour always means the same score. */\n.points-meter {\n  background: linear-gradient(to right, #ff6600, #99cc00, #00cc00);\n}\n\n/* ...and the unearned remainder is covered from the right. Opaque, or the gradient shows through. */\n.meter-mask {\n  position: absolute;\n  top: 0;\n  right: 0;\n  bottom: 0;\n  width: 100%;\n  background: var(--meter-empty);\n  transition: width 120ms linear;\n}\n\n/* Milestone notches: short marks rising from the bar's lower edge rather than full-height lines\n   across it. Nothing is overlaid on them now, and a passed milestone fades out -- it has been\n   collected, so it stops asking for attention. */\n.meter-tick {\n  position: absolute;\n  bottom: 0;\n  height: 45%;\n  width: 2px;\n  border-radius: 1px;\n  background: light-dark(rgb(18 33 26 / 45%), rgb(230 239 233 / 45%));\n  transition: opacity 160ms ease;\n}\n\n.meter-tick.earned {\n  opacity: 0.25;\n}\n\n/* --- dial (the bokeh Dial, by hand) --- */\n\n.dial {\n  display: block;\n  width: 100%;\n  max-width: 190px;\n  margin: 0 auto 0.4rem;\n}\n\n.dial-track,\n.dial-value {\n  fill: none;\n  stroke-width: 16;\n  stroke-linecap: round;\n}\n\n.dial-track {\n  stroke: rgb(20 86 74 / 12%);\n}\n\n.dial-value {\n  /* PI * r, the full length of the half-circle arc */\n  stroke-dasharray: 282.74;\n  stroke: #999;\n  transition: stroke-dashoffset 180ms ease-out;\n}\n\n.dial-value.poor {\n  stroke: #ff0000;\n}\n\n.dial-value.weak {\n  stroke: #ff6600;\n}\n\n.dial-value.fair {\n  stroke: #ffcc00;\n}\n\n.dial-value.ok {\n  stroke: #99cc00;\n}\n\n.dial-value.good {\n  stroke: #00cc00;\n}\n\n.dial-text {\n  text-anchor: middle;\n  font-size: 1.5rem;\n  font-weight: 700;\n  fill: var(--ink);\n}\n\n/* --- filter + topics --- */\n\n.controls input[type=\"text\"],\n.controls select {\n  font: inherit;\n  padding: 0.35rem 0.5rem;\n  border: 1px solid light-dark(rgb(20 86 74 / 35%), rgb(230 239 233 / 25%));\n  border-radius: 6px;\n  width: 100%;\n  background: light-dark(white, #16211d);\n  color: var(--ink);\n}\n\n.filter-status {\n  font-size: 0.8rem;\n  line-height: 1.35;\n}\n\n.filter-line + .filter-line {\n  margin-top: 0.15rem;\n}\n\n/* `.advanced` is the fold the bidding-tree filter lives in, and it is styled with `.filter-help`\n   because they are the same kind of thing: a disclosure holding the part of the drawer that only\n   someone who already knows the pattern language wants open. */\n.filter-help,\n.advanced,\n.filter-help ul {\n  font-size: 0.8rem;\n}\n\n.filter-help summary,\n.advanced summary {\n  cursor: pointer;\n}\n\n.filter-help ul {\n  padding-left: 1.1rem;\n}\n\ncode {\n  color: light-dark(var(--ink), #a9d8bf);\n  background: light-dark(rgb(0 0 0 / 8%), rgb(230 239 233 / 12%));\n  border-radius: 3px;\n  padding: 0 0.2rem;\n}\n\nbutton.light {\n  background: light-dark(#eef5f2, #223029);\n  color: var(--ink);\n  box-shadow: inset 0 0 0 1px light-dark(rgb(20 86 74 / 20%), rgb(230 239 233 / 20%));\n}\n\n.topics-dialog {\n  border: 0;\n  border-radius: 16px;\n  padding: 1.4rem;\n  /* clamped to the viewport: a fixed 460px is wider than a phone, which would put a horizontal\n     scrollbar on the page whenever the picker was open */\n  /* Wide enough for the topic list to flow into columns -- see `.topic-list`. Nineteen topics in\n     one column needed ~1080px of height and scrolled on every laptop; three columns fit. */\n  /* WIDTH, not just max-width. The card is fixed-positioned, so it shrink-to-fits its content --\n     and a grid of `minmax(13rem, 1fr)` tracks is happy at one column, so the picker stayed narrow\n     and the columns never appeared. Stating the width is what lets the list use them. */\n  width: min(56rem, 92vw);\n  max-width: 92vw;\n  box-shadow: var(--elev-4);\n  position: fixed;\n  inset: 5vh auto auto 50%;\n  transform: translateX(-50%);\n  /* ABOVE the drawer (which is z-index 30 as a mobile overlay). The Topics button lives IN the\n     drawer, so on a phone the picker opened behind the thing you opened it from and looked like a\n     no-op. Desktop hid the bug: there the sidebar is a column and never overlaps the dialog. */\n  z-index: 50;\n  max-height: 90dvh;\n  /* the card itself never scrolls; `.topics-scroll` inside it does */\n  overflow: hidden;\n}\n\n/* `[open]` and not the rule above: a closed `<dialog>` is `display: none` from the UA, and stating\n   `display: flex` unconditionally would leave the picker on screen permanently. */\n.topics-dialog[open] {\n  display: flex;\n  flex-direction: column;\n  /* stretch, EXPLICITLY: Pico's own `dialog` rule is a centring flex overlay (`align-items: center`),\n     which this rule only half-overrides -- the children then shrink-to-fit and the topic list came\n     out 208px wide inside an 896px card, so its columns never appeared. */\n  align-items: stretch;\n}\n\n.topics-dialog h2 {\n  margin-top: 0;\n}\n\n.topics-dialog p,\n.topics-dialog li {\n  font-size: 0.9rem;\n}\n\n/* The card is a COLUMN: a scroller in the middle, the buttons pinned outside it. The whole dialog\n   used to scroll, so nineteen topics pushed Apply / Clear / Close half off the bottom edge. */\n.topics-scroll {\n  overflow-y: auto;\n  /* a flex item will not shrink below its content without this, so the scroller would grow the card\n     instead of scrolling inside it */\n  min-height: 0;\n  margin-bottom: 0.2rem;\n}\n\n/* As many columns as the card is wide enough for. Nineteen topics stacked in one column is ~880px\n   of list, which scrolls on any laptop; at three columns they are all visible at once, which is the\n   point of a picker you scan rather than read. One column on a phone, where 13rem does not fit twice. */\n.topic-list {\n  display: grid;\n  grid-template-columns: repeat(auto-fit, minmax(13rem, 1fr));\n  gap: 0.35rem 1.25rem;\n  margin-bottom: 0.6rem;\n}\n\n.topic-list label {\n  display: grid;\n  grid-template-columns: auto 1fr;\n  gap: 0.4rem;\n  align-items: center;\n}\n\n.dialog-actions {\n  display: flex;\n  gap: 0.5rem;\n  margin: 0.8rem 0;\n}\n\n.topic-legend {\n  padding-left: 1.1rem;\n}\n\n/* --- question --- */\n\n.intro {\n  margin: 0 0 0.8rem;\n  font-size: 1.3rem;\n  font-weight: 600;\n}\n\n/* A light card face, not white-on-green: the suit colours are fixed values taken from bml, and\n   black spades / MediumSeaGreen clubs need a pale background to read. */\n.answer {\n  margin: 0 0 1.4rem;\n  padding: 0.6rem 1rem;\n  font-size: 2rem;\n  text-align: center;\n  color: var(--ink);\n  background: var(--face);\n  border-radius: 14px;\n  box-shadow: inset 0 0 0 1px rgb(0 0 0 / 10%);\n}\n\n/* A GRID, not flex-wrap: with `space-evenly` the buttons were sized by their text, so the button\n   under the cursor moved between questions -- and the time bonus rewards answering fast, so that\n   cost mis-clicks. Equal columns mean position depends only on how many choices there are. */\n/* The well: recessed, so the near-white cards have something to be raised OUT of. The inset shadow\n   is what makes it read as a depression rather than just a darker rectangle, and it groups the five\n   choices as one thing -- which is also what the shake and the ring flash animate against. */\n.candidates {\n  display: grid;\n  grid-template-columns: repeat(auto-fit, minmax(16rem, 1fr));\n  gap: 0.8rem;\n  align-items: stretch;\n  padding: 0.8rem;\n  border-radius: 14px;\n  background: var(--well);\n  box-shadow: var(--elev-inset);\n}\n\nbutton {\n  font: inherit;\n  cursor: pointer;\n  border: 0;\n  border-radius: 6px;\n  padding: 0.5rem 1rem;\n  background: var(--primary);\n  color: white;\n}\n\nbutton:focus-visible,\ninput:focus-visible,\nselect:focus-visible {\n  outline: 2px solid var(--primary);\n  outline-offset: 2px;\n}\n\nbutton:disabled {\n  opacity: 0.55;\n  cursor: not-allowed;\n}\n\nbutton.warning {\n  background: #d29922;\n}\n\nbutton.danger {\n  background: #cf222e;\n}\n\n.candidate {\n  display: flex;\n  align-items: center;\n  justify-content: center;\n  gap: 0.5rem;\n  min-height: 3.4rem;\n  font-size: 2rem;\n  padding: 0.4rem 1.1rem;\n  background: var(--face);\n  color: var(--ink);\n  /* the boundary that does the accessible work -- 3.17:1 on the face, so the card has an edge even\n     where two near-white fills are indistinguishable */\n  border: 1px solid var(--card-edge);\n  box-shadow: var(--elev-1);\n}\n\n.candidate-text {\n  text-align: center;\n}\n\n/* the digit accelerator, shown so it is discoverable rather than folklore */\n.accel {\n  flex: none;\n  font-family: inherit;\n  font-size: 0.8rem;\n  font-weight: 700;\n  line-height: 1;\n  padding: 0.15rem 0.35rem;\n  border-radius: 4px;\n  color: light-dark(#14564a, #a9d8bf);\n  background: light-dark(rgb(20 86 74 / 10%), rgb(230 239 233 / 12%));\n}\n\n/* `hover: hover` is the whole rule's guard, not a nicety. A touch device fires :hover on tap and\n   LEAVES IT THERE until you touch something else, so the card you just answered with stayed lit\n   through the next question -- reported as \"the last clicked button is white on a phone\". A pointer\n   that cannot hover should not have hover styling at all. */\n@media (hover: hover) {\n  .candidate:hover:not(:disabled) {\n    background: var(--face-hover);\n    box-shadow: var(--elev-3);\n  }\n}\n\n/* --- revealed answer (replaces panel's blocking 4.2s toast) --- */\n\n.candidate.revealed {\n  cursor: default;\n  box-shadow: none;\n  opacity: 0.55;\n}\n\n.candidate.revealed.correct {\n  opacity: 1;\n  box-shadow: inset 0 0 0 3px var(--suit-club);\n}\n\n.candidate.revealed.wrong {\n  opacity: 1;\n  box-shadow: inset 0 0 0 3px var(--suit-heart);\n}\n\n.candidate.revealed .mark {\n  flex: none;\n  width: 1.2em;\n  font-size: 1.4rem;\n  font-weight: 700;\n}\n\n.candidate.revealed.correct .mark {\n  color: var(--suit-club);\n}\n\n.candidate.revealed.wrong .mark {\n  color: var(--suit-heart);\n}\n\n.reveal-actions {\n  display: flex;\n  align-items: center;\n  gap: 0.7rem;\n  margin-top: 1rem;\n}\n\n.reveal-hint {\n  font-size: 0.85rem;\n  opacity: 0.7;\n}\n\n/* --- timer --- */\n\n.timer {\n  margin: 1.2rem 0;\n  height: 2rem;\n  background: rgb(0 0 0 / 10%);\n  border-radius: 4px;\n  overflow: hidden;\n}\n\n.timer-fill {\n  height: 100%;\n  width: 100%;\n  background: #00cc00;\n  transition: width 100ms linear;\n}\n\n.timer-fill.spent {\n  background: #444;\n}\n\n.timer-fill.low {\n  background: #ff6600;\n}\n\n.timer-fill.mid {\n  background: #ffcc00;\n}\n\n.timer-fill.high {\n  background: #00cc00;\n}\n\n/* --- toasts: one at a time, centred, as panel showed them --- */\n\n/* Bottom-right, not centre-screen: a notification should not sit on top of the thing it is\n   commenting on. Panel's default was centre-centre, which is why answering felt blocking. */\n.toasts {\n  position: fixed;\n  right: 1.2rem;\n  bottom: 1.2rem;\n  display: grid;\n  gap: 0.5rem;\n  justify-items: end;\n  pointer-events: none;\n  z-index: 10;\n}\n\n.toast {\n  /* the game's voice, not the reading face -- see the type note in `:root` */\n  font-family: var(--display-font);\n  padding: 1rem 1.6rem;\n  border-radius: 10px;\n  font-size: 1.5rem;\n  font-weight: 600;\n  color: white;\n  box-shadow: var(--elev-3);\n  animation: pop 140ms ease-out;\n}\n\n.toast.success {\n  background: #2da44e;\n}\n\n.toast.info {\n  background: #0969da;\n}\n\n.toast.warning {\n  background: #bf5b00;\n}\n\n@keyframes pop {\n  from {\n    transform: scale(0.9);\n    opacity: 0;\n  }\n  to {\n    transform: scale(1);\n    opacity: 1;\n  }\n}\n\n/* --- completion + notes --- */\n\n.celebrate {\n  margin: 0.2rem 0;\n  font-size: 3rem;\n  text-align: center;\n}\n\n.celebrate-text {\n  font-size: 1.6rem;\n  text-align: center;\n}\n\n#quiz img {\n  display: block;\n  margin: 1rem auto;\n  max-width: 100%;\n  border-radius: 12px;\n}\n\n.notes {\n  margin-top: 1.5rem;\n  background: var(--card);\n  border-radius: 12px;\n  padding: 0.8rem 1rem;\n  box-shadow: var(--elev-1);\n}\n\n.notes summary {\n  cursor: pointer;\n  font-weight: 600;\n}\n\n.notes iframe {\n  width: 100%;\n  height: 40vh;\n  border: 0;\n}\n\n.hint {\n  margin: 0;\n  font-size: 0.85rem;\n}\n\n/* --- motion --- */\n\n/* Everything that moves here is decoration: the timer bar, the dial sweep, the toast pop, the\n   sidebar collapse. Honour the OS setting rather than animating regardless. */\n@media (prefers-reduced-motion: reduce) {\n  *,\n  *::before,\n  *::after {\n    animation-duration: 0.001ms !important;\n    animation-iteration-count: 1 !important;\n    transition-duration: 0.001ms !important;\n    scroll-behavior: auto !important;\n  }\n}\n\n/* the collapsed presentation group in the settings panel */\n.appearance summary {\n  cursor: pointer;\n  font-size: 0.9rem;\n}\n\n.appearance[open] {\n  display: grid;\n  gap: 0.7rem;\n}\n\n/* --- dark palette ---------------------------------------------------------\n   Now that these exist, `color-scheme` above says `light dark` honestly: the browser's own surfaces\n   (canvas, scrollbars, form controls) follow the OS, and so do ours.\n\n   The suits are re-picked, not reused. Black is 1.37:1 on a dark card face -- an invisible spade --\n   so it becomes near-white, which is what four-colour decks do in dark themes anyway. The other\n   three lighten until each clears 4.5:1 on the dark face. Measured in tests/test_suit_colours.py,\n   which checks both palettes. */\n/* --- the completion screen's figures (see templates/completed.html.j2) ---\n   Layout only. The assembling animation lives in `juice.css`, so with the game-feel toggle off this\n   is a legible score summary rather than a broken one -- which is why the two are split. */\n.finale-figures {\n  display: flex;\n  flex-wrap: wrap;\n  justify-content: center;\n  gap: 1.6rem;\n  margin: 1rem 0 1.4rem;\n}\n\n.finale-stat {\n  display: flex;\n  flex-direction: column;\n  align-items: center;\n  gap: 0.15rem;\n}\n\n.figure {\n  /* the game's voice, not the reading face -- see the type note in `:root` */\n  font-family: var(--display-font);\n  font-size: 2.4rem;\n  font-weight: 800;\n  font-variant-numeric: tabular-nums;\n  line-height: 1;\n  color: var(--card-accent);\n}\n\n.figure.big {\n  font-size: 3.4rem;\n}\n\n.figure-unit {\n  /* the game's voice, not the reading face -- see the type note in `:root` */\n  font-family: var(--display-font);\n  font-size: 1.6rem;\n  font-weight: 700;\n  color: var(--card-accent);\n}\n\n.finale-label {\n  font-size: 0.85rem;\n  opacity: 0.75;\n}\n\n/* COLOUR emoji, asked for by name. `--suit-symbols` puts \"Segoe UI Symbol\" in every stack ahead of\n   the generic so the SUIT glyphs land in a chosen face rather than a last-resort one -- and that same\n   font also has the party popper, in monochrome, so the finale's poppers and confetti turned into\n   black line art. The two wants are opposite: the suits want a text face (they are coloured by CSS,\n   see `font-variant-emoji: text` above), the party wants the colour emoji font. So the party names\n   it. `font-variant-emoji: emoji` asks for the colour presentation as well as the face; browsers\n   that do not know the property ignore it and the font choice still does the work. */\n.pop,\n.confetti-bit {\n  font-family: \"Segoe UI Emoji\", \"Apple Color Emoji\", \"Noto Color Emoji\", sans-serif;\n  font-variant-emoji: emoji;\n}\n\n/* inline-block so each character can be transformed on its own */\n.digit,\n.pop {\n  display: inline-block;\n}\n\n/* --- the debug panel (dev only; see `app.DEBUG_MODE`) ---\n   Deliberately plain and a bit ugly: scaffolding should look like scaffolding, so nobody mistakes it\n   for part of the quiz or leaves it armed on a deployment. */\n.panel.debug {\n  background: light-dark(#fff6e0, #2a2312);\n  box-shadow: inset 0 0 0 2px light-dark(#d29922, #8a6a1a);\n  display: grid;\n  gap: 0.4rem;\n  font-size: 0.85rem;\n}\n\n.debug-row {\n  display: flex;\n  gap: 0.35rem;\n  flex-wrap: wrap;\n}\n\n.debug-row button {\n  font-size: 0.8rem;\n  padding: 0.2rem 0.45rem;\n  width: auto;\n  margin: 0;\n}\n\n/* --- the HUD (app bar): live state + Skip ---\n   The score used to be in the app bar AND duplicated in a sidebar `#score` panel, while Skip -- an\n   action you take mid-question -- sat in the sidebar beside the controls that restart the quiz. Now\n   everything you need while playing is up here, and the drawer holds only what restarts the quiz. */\n.hud-meter {\n  width: 7rem;\n  height: 0.5rem;\n  flex: none;\n  box-shadow: inset 0 0 0 1px rgb(255 255 255 / 25%);\n}\n\n/* The mask covers the UNEARNED part, so it has to be OPAQUE: the track carries the red-to-green\n   gradient, and anything translucent lets that gradient show through -- which makes the gauge look\n   full at every score. (It was `rgb(255 255 255 / 22%)` for one commit, chosen to stop an opaque\n   pale-green block reading as a stray rectangle on the green bar, and that is exactly what it broke.)\n   The app bar's own dark green is the answer: opaque, so the gradient is hidden, and it reads as an\n   unfilled groove in the bar rather than a foreign colour sitting on top of it. */\n.hud-meter .meter-mask {\n  background: var(--primary-dark);\n}\n\n.hud-meter .meter-tick {\n  background: rgb(255 255 255 / 55%);\n}\n\n.hud-meter .meter-tick.earned {\n  opacity: 0.45;\n}\n\n.topbar .skip {\n  flex: none;\n  display: inline-flex;\n  align-items: center;\n  gap: 0.35rem;\n  padding: 0.25rem 0.6rem;\n  font-size: 0.85rem;\n  font-weight: 600;\n  width: auto;\n  margin: 0;\n}\n\n.skip-count {\n  font-variant-numeric: tabular-nums;\n  padding: 0 0.3rem;\n  border-radius: 999px;\n  background: rgb(0 0 0 / 18%);\n}\n\n/* The app bar is the one place where running out of width is likely, so the pieces drop in order of\n   what you can live without: the gauge first (the points number says the same thing less precisely),\n   then the score fraction. Skip and the streak never drop -- one is an action, the other is the\n   reason to keep going. */\n@media (max-width: 760px) {\n  .hud-meter {\n    display: none;\n  }\n}\n\n@media (max-width: 520px) {\n  .topbar h1 {\n    font-size: 1rem;\n    overflow: hidden;\n    text-overflow: ellipsis;\n    white-space: nowrap;\n  }\n\n  .topbar-score {\n    font-size: 0.8rem;\n  }\n}\n\n/* the dial's new home: a folded group, because it spends a lot of space on one number */\n.panel.progress > summary {\n  cursor: pointer;\n  font-weight: 600;\n  font-size: 0.9rem;\n}\n\n.panel.progress[open] {\n  display: grid;\n  gap: 0.4rem;\n}\n\n.panel.progress .dial {\n  max-width: 130px;\n}\n\n/* THE MOBILE DRAWER MUST COME LAST.\n   This block used to sit ABOVE the base `.sidebar` rule, and `position: sticky` there beat the\n   `position: fixed` here -- same specificity, later wins -- so the off-canvas drawer never\n   applied on a phone at all: the sidebar stayed a sticky 320px column. The other two\n   stylesheets happened to declare it after their base rules and were unaffected, whic
